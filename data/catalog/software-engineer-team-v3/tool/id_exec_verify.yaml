id: id_exec_verify
kind: tool
namespace: software-engineer-team-v3
user_id: anonymous
model_type: akgentic.tool.sandbox.ExecTool
description: Sandboxed execution for the reviewer — verifying that the tests actually
  pass
payload:
  mode: auto
  exec_command:
    instructions: |-
      Use this to RUN the tests the developer says pass, and the project's own lint and type checks.
      A review that takes a test result on trust is an inspection, not a review.

      Run; do not fix. If something fails that is a finding for your verdict - report the real
      output. Never edit code to make a test pass: that is @Developer's job, and doing it yourself
      destroys the independence that makes your review worth anything.
