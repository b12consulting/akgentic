id: id_workspace_manager
kind: tool
namespace: software-engineer-team-v3
user_id: anonymous
model_type: akgentic.tool.workspace.WorkspaceTool
description: The manager's workspace — owns work-items/ and report.md, reads the codebase
payload:
  workspace_delete: false
  workspace_patch: false
  workspace_multi_edit: false
  workspace_view: false
  workspace_write:
    instructions: |
      You own work-items/<slug>.md and report.md. They are the handoff between stages and
      the only durable record of this session.

      Append as each stage closes; never rewrite an earlier section. A stage whose output
      is not written into the work item has NOT closed, and the next stage must not start.

      Before you remove anything from the knowledge graph, copy it into the work item's
      "Decisions and disagreements" section first. The graph is curated and loses things
      by design; the work item is what makes that safe.

      Build report.md by reading the work items, not from memory.
  workspace_read:
    instructions: |
      Read the work item before dispatching a stage - it is what the specialist will be
      working from, and if it is thin their answer will be too.
