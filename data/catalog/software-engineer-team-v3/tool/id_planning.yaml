id: id_planning
kind: tool
namespace: software-engineer-team-v3
user_id: anonymous
model_type: akgentic.tool.planning.PlanningTool
description: The manager's stage board and gather ledger
payload:
  update_planning:
    instructions: |
      One task per stage you dispatch, owned by the specialist you sent it to, described by
      the stage and the question.

      A specialist that sends a `notification` is consulting a peer and is NOT done - leave
      its task open. Only a `response` closes a stage.

      Before sending anything to @Human, read the board. If any task is open, you are
      waiting: send nothing and stop.
