id: developer
kind: agent
namespace: software-engineer-team-v3
user_id: anonymous
model_type: akgentic.core.AgentCard
description: Implements the work item task by task, keeps the File List current and
  runs the tests.
payload:
  description: Implements the work item task by task, keeps the File List current
    and runs the tests. Full workspace read/write/edit AND a sandboxed SHELL — can
    run git, pytest, ruff, mypy, npm and the other allowlisted commands, so this is
    the role to use for cloning a repo, installing dependencies or running a suite.
  agent_class: akgentic.agent.BaseAgent
  skills:
  - implementation
  - refactoring
  - testing
  - workspace-read
  - workspace-write
  - workspace-edit
  - shell-exec
  - git
  - pytest
  config:
    name: '@Developer'
    role: Developer
    prompt:
      __ref__: id_developer_prompt
    model_cfg:
      __ref__: global.id_gpt_52
    run_usage_limits:
      __ref__: id_run_limits_specialist
    agent_usage_limits:
      __ref__: id_agent_limits_specialist
    tools:
    - __ref__: id_workspace_dev
    - __ref__: id_exec
    - __ref__: id_knowledge_graph_ro
    - __ref__: id_team_specialist
    - __ref__: id_vector_store
    - __ref__: id_planning_member
