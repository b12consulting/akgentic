id: analyst
kind: agent
namespace: software-engineer-team-v3
user_id: anonymous
model_type: akgentic.core.AgentCard
description: Turns a request into scoped, testable acceptance criteria and names what
  is out of scope.
payload:
  description: Turns a request into scoped, testable acceptance criteria and names
    what is out of scope. Reads the codebase with glob and grep, writes its own analysis
    file, and can search the web. Cannot edit source code and has NO shell.
  agent_class: akgentic.agent.BaseAgent
  skills:
  - requirements
  - scoping
  - acceptance-criteria
  - workspace-read
  - glob
  - grep
  - web-search
  - writes-own-analysis
  - no-source-edit
  - no-shell
  config:
    name: '@Analyst'
    role: Analyst
    prompt:
      __ref__: id_analyst_prompt
    model_cfg:
      __ref__: global.id_gpt_52
    run_usage_limits:
      __ref__: id_run_limits_specialist
    agent_usage_limits:
      __ref__: id_agent_limits_specialist
    tools:
    - __ref__: id_workspace_analysis
    - __ref__: id_search_analyst
    - __ref__: id_knowledge_graph_ro
    - __ref__: id_team_specialist
    - __ref__: id_vector_store
    - __ref__: id_planning_member
