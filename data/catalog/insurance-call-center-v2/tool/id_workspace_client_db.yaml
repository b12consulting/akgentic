id: id_workspace_client_db
kind: tool
namespace: insurance-call-center-v2
user_id: anonymous
model_type: akgentic.tool.workspace.WorkspaceTool
description: Read-only client identity database, role-scoped to @ClientIdentificationSpecialist.
  workspace_id is fixed and unique to this role, so no other agent's WorkspaceTool
  card can reach this directory even if one were added later.
payload:
  workspace_id: insurance-call-center-client-identity-db
  read_only: true
  workspace_view: false
  workspace_list: false
  workspace_glob: false
  workspace_grep: false
  expand_media_refs: false
  workspace_read:
    instructions: |
      The only file here is clients.csv. Read it once.
  resources:
