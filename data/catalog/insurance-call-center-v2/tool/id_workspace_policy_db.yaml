id: id_workspace_policy_db
kind: tool
namespace: insurance-call-center-v2
user_id: anonymous
model_type: akgentic.tool.workspace.WorkspaceTool
description: Read-only policy database, role-scoped to @ContractIdentificationSpecialist.
  Different workspace_id than the client identity database, so this role cannot see
  client PII and the identity role cannot see policy data.
payload:
  workspace_id: insurance-call-center-policy-db
  read_only: true
  workspace_view: false
  workspace_list: false
  workspace_glob: false
  workspace_grep: false
  expand_media_refs: false
  workspace_read:
    instructions: |
      The only file here is policies.csv. Read it once.
  resources:
  - file_name: policies.csv
