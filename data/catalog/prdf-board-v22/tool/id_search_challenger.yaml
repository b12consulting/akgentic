id: id_search_challenger
kind: tool
namespace: prdf-board-v22
user_id: anonymous
model_type: akgentic.tool.search.SearchTool
description: Web search — prior art and failed attempts
payload:
  web_fetch: false
  web_crawl: false
  web_search:
    max_results: 3
    instructions: |
      Search for evidence that would REFUTE the opportunity: products already on the
      market that do this, companies that tried and withdrew, costs that make it
      uneconomic, regulations that forbid it. An existing product is the strongest
      possible objection — look for it first.
