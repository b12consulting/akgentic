id: id_search_regulator
kind: tool
namespace: prdf-board-v22
user_id: anonymous
model_type: akgentic.tool.search.SearchTool
description: Web search — standards, safety and data protection
payload:
  web_fetch: false
  web_crawl: false
  web_search:
    max_results: 3
    instructions: |
      Search only when you genuinely do not know this category's rules. Look for
      applicable safety standards, recall notices, cybersecurity and radio requirements,
      data-protection decisions on connected devices, and repairability obligations. Do
      not cite an instrument you could not ground — describe the obligation instead.
      One search is usually enough.
