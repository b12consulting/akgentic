id: id_search_owner
kind: tool
namespace: prdf-board-v22
user_id: anonymous
model_type: akgentic.tool.search.SearchTool
description: Web search — lived experience and complaints
payload:
  web_fetch: false
  web_crawl: false
  web_search:
    max_results: 3
    instructions: |
      Search only when you genuinely do not know how people live with this product.
      Look for one- and two-star reviews, forum threads and running-cost complaints —
      the moments where the product costs someone effort, time or trust. Not the
      manufacturer's feature list. One search is usually enough.
