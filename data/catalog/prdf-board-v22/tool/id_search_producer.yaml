id: id_search_producer
kind: tool
namespace: prdf-board-v22
user_id: anonymous
model_type: akgentic.tool.search.SearchTool
description: Web search — BOM cost and manufacturing consequences
payload:
  web_fetch: false
  web_crawl: false
  web_search:
    max_results: 3
    instructions: |
      Search only when you genuinely do not know the component economics. Look for
      sensor and module unit prices at volume, BOM teardowns of comparable connected
      products, radio certification requirements and power budgets. Ground your numbers;
      label anything you could not ground as an estimate. One search is usually enough.
