id: id_search_experience
kind: tool
namespace: prdf-dimensions-v22
user_id: anonymous
model_type: akgentic.tool.search.SearchTool
description: Web search — tuned for users, journeys and complaints
payload:
  web_fetch: false
  web_crawl: false
  web_search:
    max_results: 3
    instructions: |
      At most TWO searches this turn. Every result stays in context for the rest of the
      turn, so a fourth search costs more than it adds — search wide once, not narrow
      four times.

      Search for how people actually live with this product: user reviews and complaints,
      forum threads, journey and process descriptions, and the roles of the professionals
      who sell, service, inspect or dispose of it. Complaints are the richest source —
      they name the moments where the experience currently fails.
