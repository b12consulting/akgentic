id: id_workspace
kind: tool
namespace: global_tools
user_id: anonymous
model_type: akgentic.tool.workspace.WorkspaceTool
description: Workspace tool — read/view/list/glob/grep/write/edit/patch/mkdir over a filesystem (all defaults)
payload:
  name: Workspace
  workspace_id: null
  read_only: false
  workspace_read:
    instructions: null
    expose: [tool_call]
    default_limit: 2000
    force_document_regeneration: false
    document_reader:
      llm_client: openai
      llm_model: gpt-5.4-mini
  workspace_view:
    instructions: null
    expose: [tool_call]
    max_dimension: 1568
  workspace_list:
    instructions: null
    expose: [tool_call]
    max_depth: 1
  workspace_glob:
    instructions: null
    expose: [tool_call]
    max_results: 100
  workspace_grep:
    instructions: null
    expose: [tool_call]
    max_results: 100
    max_line_length: 2000
  expand_media_refs:
    instructions: null
    expose: [command]
  workspace_write:
    instructions: null
    expose: [tool_call]
  workspace_delete:
    instructions: null
    expose: [tool_call]
  workspace_edit:
    instructions: null
    expose: [tool_call]
  workspace_multi_edit:
    instructions: null
    expose: [tool_call]
  workspace_patch:
    instructions: null
    expose: [tool_call]
  workspace_mkdir:
    instructions: null
    expose: [tool_call]
  resources: []
