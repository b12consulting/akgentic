id: id_knowledge_graph
kind: tool
namespace: global_tools
user_id: anonymous
model_type: akgentic.tool.knowledge_graph.KnowledgeGraphTool
description: Knowledge graph tool — get/update/search a vector-store-backed graph (all defaults)
payload:
  vector_store: true
  search_top_k: 10
  search_score_threshold: 0.3
  read_only: false
  get_graph:
    instructions: null
    expose: [system_prompt, command]
    prompt_include_schema: true
    prompt_include_roots: true
  update_graph:
    instructions: null
    expose: [tool_call]
  search:
    instructions: null
    expose: [tool_call, command]
