id: id_team
kind: tool
namespace: global_tools
user_id: anonymous
model_type: akgentic.tool.team.TeamTool
description: Team management tool — hire/fire members, role profiles, team roster,
  who-is-working activity (all defaults)
payload:
  hire_team_members:
    instructions: null
    expose: [tool_call, command]
  fire_team_members:
    instructions: null
    expose: [tool_call, command]
  get_role_profiles:
    instructions: null
    expose: [system_prompt, command]
  get_team_roster:
    instructions: null
    expose: [system_prompt, command]
  get_team_activity:
    instructions: null
    expose: [tool_call, command]
    summarizer: null          # set a model spec block to enable on-demand summaries
    stale_after_seconds: 300.0
    max_task_chars: 200
