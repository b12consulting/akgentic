    # PRODUCT DIGITIZATION FRAMEWORK

    ## INTRODUCTION

    Product digitization – the use of digital technologies to enhance and even transform products, can profoundly change how the product is produced, distributed, sold and experienced.

    Consider the case of product digitization in the music industry. In much of the twentieth century, people listened to their favorite music on the radio or by playing vinyl records. In the 1980s, music was  digitized on Compact Discs with increased quality  of storing and processing. The decade of the 1990s saw the evolution of the commercial Internet, and soon, music was made available in digital formats that could be accessed online and played on various digital media players, first through downloading and later by streaming the music from the cloud. Hence, in addition to its form, digitization changed the way in which music was sold, priced, distributed and experienced. Moreover, digitization remade not only the music industry, but also the consumer electronics and entertainment industries.

    The benefits of digitization in the case of music are plentiful. The customer nowadays has access to an endless selection of music in the cloud at a low monthly subscription fee, as well as the opportunity for personalized recommendations through Artificial Intelligence. Such a personalized service may create lock-in effects and switching costs. The service provider understands the customers much better and can continuously improve the experience. The power of the network can also be leveraged, as peers can recommend playlists. Also, artists can reach much bigger audiences and potentially disintermediate the music labels.

    As another example, consider automobiles. Back in the 1950s and 1960s, long before computers and consumer electronics were widespread, a car was a complex structure made of steel, glass, rubber and plastic, driven by an internal combustion engine and controlled by a variety of electromechanical devices. And besides wear and tear, it largely remained unchanged over its multi-decade lifespan. Fast-forward to today. While today’s cars are still complex structures made of steel, glass, rubber and plastic, they are increasingly defined by networks of sophisticated computers, electronic devices and software. And as a result, the key features of the car can be modified and enhanced relatively easily. In the case of electric cars such as the Tesla, the performance attributes can be changed even without any effort by the owner (e.g., through wireless upgrades of software).

    The difference between the 1950s car and the almost-2020s car is not just in functionality and sophistication, but also in the owner’s experience, from purchase to use to maintenance, and even to the value proposition itself. And this has huge implications for the automobile industry and related sectors as well.

    As digitization is fundamentally changing many industries, an important question arises: How can a product or service be digitized? For many products, at least some ways are relatively easy to identify. However, other possibilities are less obvious, including some that could significantly impact the capabilities and appeal of the product. Also, while for certain product categories, such as music, digitization is already at an advanced stage today, the digitization opportunities for other products and services such as clothing, education and food, are still largely untapped. In general, the question of how to digitize their products is not easy to answer for many executives. Even when their products have already been digitized to some extent, next steps are not always obvious, particularly given the ongoing and rapid advancement of digital technologies.

    To guide business leaders in exploring product digitization, the Product Digitization Framework was developed by Professor Steve Muylle and Doctor Willem Standaert from Vlerick Business School, and Professor Amit Basu from the Edwin L. Cox School of Business, Southern Methodist University, Dallas, Texas, as part of the Accenture Belux – Vlerick Digital 20/20 Chair.

    ## THE PRODUCT DIGITIZATION FRAMEWORK

    The framework can help companies identify opportunities for product digitization, and is not limited to specific technologies or products. It comprises four dimensions: (1) composition, (2) connectivity, (3) capabilities, and (4) user experience.

    ### Composition dimension

    The composition dimension addresses the questions: What is the product? What is it made of? How is it structured? What is the product architecture or the service blueprint? In the framework, each product is a system, which can consist of one or more sub-systems, which in turn can consist of one or more sub-systems, in a composition hierarchy down to specific components (see Figure 1 for an abstract representation).

    Digitizing a product, sub-system or component may convert it from an “analog” system (tangible, electromechanical) to a digital system. For instance, a song, which is a sequence of audio waves, becomes a stream of electronic waves when digitized. In order for physical systems and/or the user of such a digital artefact to experience it and interact with it, a digital-to-physical interface is required.

    Consider a suitcase as an example. The composition can be represented as in Figure 2, with 4 sub-systems (lock, handle, casing, wheels). For illustrative purposes, one sub-system is broken down into its components: the casing consists of an outside and inside surface, as well as an ID pouch. Digitization can be established at the level of the component, the sub-system, or the complete product.

    ### Connectivity dimension

    The second dimension is connectivity, which refers to the type of connections that exist between the product and its environment. The entities to which the product can connect range from the local user who has direct access to the product, to its local environment (other users, products and systems in the vicinity of the product), and finally to the cloud (remotely located user, producer, or other entities, products and systems).

    Continuing the suitcase example (see Figure 4), the local user would connect with the digital lock via the digital-to-physical user interface. Through the interface, the local user would be able to (de)activate the lock and possibly also perceive its status (open/closed, current combination number, etc.). Note that the digital lock would also have to support another interface, to the rest of the product through a physical locking mechanism. Connectivity with the local environment may occur through a sensor that detects for instance airport law-enforcement handling and an actuator for releasing the lock for security inspections. Finally, cloud connectivity could enable the owner of the suitcase to remotely detect the lock status or receive an alert when someone is tampering with the lock.

    ### Capabilities dimension

    The third dimension refers to the capabilities of the product, which are reliant on the composition and connectivity. Digitized components, sub-systems or products generate data and if the product is connected, that data can be used to enhance the product capabilities and associated value. The product, sub-system or component can sense the data (through sensors), process the data (through programming logic), and learn from the data (through machine learning algorithms) to respectively inform, change the state (through actuators), and improve performance of the product, as shown in Figure 5.

    Returning to the suitcase example, the lock digitization initiative described above could, at the basic level, include the capability to sense the lock status and inform the user or environment about it. A next level capability could be to remotely lock the suitcase (process data to change state). And at a more advanced level, the locking system could learn to add authorized users and automatically give them access, while blocking unauthorized users. The three dimensions of composition, connectivity, and capabilities are orthogonal to each other, in the sense that for each of the composition elements, various types of connections can be established, and increased levels of capabilities developed.

    ### User experience dimension

    A fourth dimension is the user experience, which refers to how the user, which could be the owner-customer, the seller-producer, the servicer-maintenance worker, or anyone that interacts with the product, experiences the product (see Figure 7). Product digitization may not only impact the experience of one or more users, it could also expand their experience with the product, for instance by adding capabilities that precede and/or succeed its current use.

    For a suitcase, the primary user is the person who travels with it. Additional users could be relatives, airport personnel handling baggage, as well as border and security control, and when maintenance is required, the technicians repairing the product. Digitization of the product may impact the user experiences of any number of these different types of users.

    ## APPLYING THE PRODUCT DIGITIZATION FRAMEWORK

    Product digitization can be initiated by mapping the current product composition along with its connectivity and capabilities, across the key user experiences. Based on this initial understanding, product innovation along any of the four dimensions of the product digitization framework can be explored. For instance, one could start by considering the user experience for the owner. This can then be tied to specific composition, connectivity and capability requirements to improve or even transform the user experience and generate additional value for the user. However, digitization could also be initiated by technological innovation that impacts a specific component or subsystem, and then resulting opportunities in the other dimensions could be analysed.

    For instance, one key element of the air travel experience is the check-in process (see Figure 8). While travellers can obtain mobile boarding passes before going to the airport, their luggage still needs to be checked in with paper luggage tags, which are typically printed at airport kiosks or check-in counters.

    How could this user experience be improved? By digitizing the ID pouch component of the suitcase, replacing the paper luggage tag by an electronic luggage tag, and adding a rugged display, the suitcase can be digitally identified (see Figure 9).

    The digitization of this component could also offer substantial value to other users in the ecosystem. For the suitcase manufacturer, a digital identifier is a way to differentiate, by expanding the value offered to potential customers, which may also create switching costs and lock-in. For the airline, it may lead to efficiency gains, as the tags would be already in place making manual handling redundant. Furthermore, border and security control agencies could also integrate luggage reporting requirements through digital pre-filled forms that are shown on the display. All of this would reduce the stress associated with air travel for the traveller.

    Furthermore, the digital identifier could enable connectivity to the local user and the local environment, for instance to check in luggage at the counter of the airline. Likewise, it could offer cloud connectivity such that the owner can track the location of the luggage at all times and update the tag remotely. The capabilities of the identifier could include sensing (travel destination) and informing (display tag). A change in routing could be processed automatically, and the tag could then be updated digitally (change of state). When there would be multiple luggage items on the same journey, belonging to different family members, the peer luggage items could learn that they belong together and all sync the tags for the same destination (performance improvement).
