description: Manager coordinating Assistant, Expert and Support Human agents team!
payload:
  name: Agent Team V1
  description: Manager coordinating Assistant, Expert and Support Human agents team!
  properties:
    overview: |
      Agent Team V1 with runtime model switching. @Manager, @Assistant and @Expert each carry a
      three-model roster and the ModelTool card, so the model can be changed mid-session by a
      human command or by the agent itself, and the choice survives a restart.
    models: |
      Roster on all three LLM agents: openai:gpt-5.2 (ACTIVE), openai:gpt-5.4, openai:gpt-4.1.
      @Assistant and @Expert previously ran gpt-4.1 and now start on gpt-5.2, with gpt-4.1 still
      reachable by switching.
      THE ROSTER ITSELF IS ONE SHARED GLOBAL ENTRY: global.id_model_roster_agent_team, a
      NativeValue carrying a list of three refs to global.id_gpt_*. All three agents point
      model_roster at that single ref, so the roster is declared once for the team rather than
      repeated per agent — add or drop a model there and every agent follows. The trade is that
      there is no per-agent subsetting left: the roster is now team-wide by construction.
      A NativeValue is how a whole LIST becomes ref-addressable. The resolver populates the
      NativeValue's payload first, in ITS OWN namespace (which is why its inner refs are written
      bare — id_gpt_54, not global.id_gpt_54), so each element arrives as a real ModelConfig; it
      then unwraps the wrapper and splices the bare list into AgentConfig.model_roster.
      model_cfg stays per-agent and is still declared BY REF to a global.id_gpt_* entry: the
      roster is the set an agent may switch between, model_cfg is the one in force, and it must be
      one of the roster's three or ReactAgentConfig refuses the config. global.id_gpt_41's
      temperature=0.3 arrives intact through both, which is what proves the refs resolve rather
      than coerce.
      A single ref in the model_roster POSITION is safe — verify it anyway (below). What is lost
      through the catalog is only the model_cfg-as-a-list union shorthand:
      DECLARE model_cfg AND model_roster AS SEPARATE FIELDS. Do NOT use the model_cfg-as-a-list
      shorthand. AgentConfig accepts a list at the input boundary and normalizes it into
      model_cfg + model_roster, but that normalization is LOST through the catalog — the list form
      (refs OR literal configs alike) round-trips with model_roster EMPTY, returning 201 with
      validate ok:true and no error anywhere. Refs themselves are fine: they resolve correctly in
      model_cfg (single) and in model_roster (list). It is only the union shorthand that is lost.
      VERIFY BY CHECKING THE ROSTER IS NON-EMPTY in /admin/catalog/team/agent-team/resolve.
      Never verify by reading the active model: gpt-5.2 is ALSO ModelConfig's built-in default
      (provider=openai, model=gpt-5.2), so "active is gpt-5.2" is indistinguishable from the
      config having been dropped entirely.
    tools: |
      id_model_switch (ModelTool) is on the three LLM agents and on neither HumanProxy — @Human
      and @Support have no model and no tools, so a roster there would mean nothing. ModelTool is
      NOT auto-injected by BaseAgent (only TeamTool and MailboxTool are); an agent has it only
      because this file says so.
      instructions are set on switch_model ONLY. They are honoured on switch_model and
      list_models, but are a SILENT NO-OP on active_model, which is an LLM_CONTEXT provider
      returning a ContextState rather than a docstring.
    flow: |
      active_model publishes the model in force as an LLM_CONTEXT delta block every turn, so an
      agent always knows what it is running on without calling anything. switch_model and
      list_models are on TOOL_CALL and COMMAND: a human types /switch_model model=openai:gpt-5.4,
      and the model can call the same capability itself. The parameter is `model`, not `key` —
      /switch_model key=... does NOT error, the whole token binds positionally to `model` and is
      refused downstream as an unknown roster key. A switch takes effect on the NEXT run, not the
      one in flight, and does not sanitize history.
    limits: |
      Unchanged. A switch does not reset the usage accumulators or the run counter — they survive
      a switch by design.
    lineage: |
      Adds runtime model switching to Agent Team V1. Requires akgentic-tool epic 36 (ModelTool,
      merged), akgentic-llm epic 22 (roster + switch_model) and akgentic-agent epic 22 (the
      observer and restore).
  shareable: false
  public: true
