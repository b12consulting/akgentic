namespace: prdf-dimensions-v22
user_id: anonymous
name: PrDF — Dimension Specialists v2.2
description: 'Dimension specialists with a durable record: the coordinator keeps an append-only analysis
  log and writes any node''s content there before pruning it, then builds the report from the log.'
properties: &id001
  overview: |-
    prdf-dimensions-v21 plus a workspace. The graph is curated and loses things by design;
    this version gives the coordinator a place where nothing is lost, and a real report
    deliverable instead of a chat message that scrolls away.
  principles: |-
    Everything in v21, plus: nothing leaves the graph without first being written to
    analysis-log.md verbatim. The log is append-only and written every round, not at the end -
    a log written only when a report is requested is written from a context window that has
    already dropped half the session. report.md is built by reading the log, never from
    memory.
  flow: |-
    @Human -> @ProductManager -> members (parallel) -> @ProductManager -> @Human.
    Hub-and-spoke: members never address @Human. Delegation is the `recipient` field on a
    Request in StructuredOutput, not a tool call. Each hop is an independent actor turn with
    no call stack, so the coordinator gathers explicitly via the planning board: one task per
    dispatch, and it stays silent while any task is open.
    Members also consult each other directly. Each has ONE named peer it MUST consult for a
    defined class of claim; it sends that peer a `request` and the coordinator a
    `notification`, then sends exactly one `response` once the peer answers. Depth is capped
    at 1 - a member answering a peer never consults anyone else - so chains always terminate.
  tools: |-
    KnowledgeGraphTool - read/write for the coordinator (it curates), read-only for members.
      get_graph is on the SYSTEM_PROMPT channel, so shared state costs no tool call.
    PlanningTool - coordinator only. The dispatch/gather ledger; get_planning is also on
      SYSTEM_PROMPT, which is what lets a coordinator know it is still waiting.
    SearchTool - one card per member, same tool with different `instructions` so each searches
      from its own stance. web_fetch and web_crawl are DISABLED: one fetch is ~24k tokens and
      stays in context for the whole turn.
    TeamTool - explicit per-tier cards, never the auto-injected default. Members get roster
      only; hire/fire and team_activity are coordinator-only (a member once polled
      team_activity 23 times in one turn instead of answering).
    VectorStoreTool - no tools of its own; it only guarantees the #VectorStore singleton that
      backs semantic search in the graph and the plan.
    WorkspaceTool - coordinator only, narrowed to read/write/edit/list. It keeps an
      append-only analysis-log.md and builds report.md from it. Nodes are copied there before
      any graph pruning, which is what makes the pruning safe. workspace_delete is off so it
      cannot destroy the archive it maintains.
  graph: A RECORD, as v21, and now safely prunable because analysis-log.md holds what is removed.
  limits: |-
    Both tiers are set on every agent; neither is set by default and the framework's only
    stock brake is pydantic-ai's run_request_limit=50 - a loop guard, not a budget.
      coordinator  run 30 req / 20 tool calls / 300k tokens ; life 100 runs / 1M
      member       run 30 req / 25 tool calls / 200k tokens ; life 50 runs / 500k
    These are the pre-tuning values and are roughly 4-7x measured clean runs - they will stop
    a runaway but are not a working brake. See prdf-board-v21 for measured values.
  lineage: Current head of the dimensions line. Successor to prdf-dimensions-v21.
shareable: false
public: true
entries:
  team:
    kind: team
    model_type: akgentic.team.TeamCard
    description: Product Manager dispatching to four PrDF dimension specialists
    payload:
      welcome_message: |
        ## Product Digitalization — **Dimension Specialists v2.2**

        This team applies the **Product Digitization Framework** (Accenture / Vlerick, 2018) to any product or service, physical or intangible.

        The work is split the way the framework itself is split — one specialist per dimension:

        | Agent | Dimension | Question it answers |
        |---|---|---|
        | **@ProductComposer** | Composition | What is the product made of? |
        | **@ProductConnector** | Connectivity | What does it connect to — user, environment, cloud? |
        | **@ProductCapabilityEngineer** | Capabilities | What can it sense, process and learn? |
        | **@ProductContextManager** | User experience | Who uses it, in which context, and how does that change? |

        **@ProductManager** holds the *method*, not the answers. It decides who to ask, waits for them, and integrates what comes back. Watch the message flow — the manager does not answer dimension questions itself.

        A good place to start is the identification of **use contexts**:

        > *I would like to explore digital enhancement opportunities for a &lt;insert product&gt;. Can you identify some use contexts for this product? For each context, please describe the intended user, when the context is applicable, and what the likely outcomes of the product's use are.*

        From there, ask the team to decompose the product, then to explore the connectivity and capability opportunities of any sub-system or component. The **knowledge graph** fills in as the team works — hit *Refresh* to see it.

        **How this version works**

        - **It asks before it answers.** Expect a couple of short questions first — it needs the product, the use context and the decision you are making.
        - **Answers are short**, written like someone talking to you, and always attributed to the specialist who found it.
        - **The specialists consult each other.** The framework's own dimensions depend on one another, so each is *obliged* to check with a named peer: connectivity cannot be settled without composition, and a *process* or *learn* capability cannot be claimed without a connectivity scope. You will see those exchanges.
        - **The graph is the record of the analysis.** Around 20–30 nodes, and each one carries the substance: what it is, who established it, what a peer confirmed or contested, and what evidence was found. Open a node to read the discussion behind it.

        - **Nothing is lost when the graph is pruned.** The coordinator keeps an append-only `analysis-log.md` in the team workspace and writes any node's full content there before removing it. Ask for a report at any point and it is built from that log, not from what happens to still be on screen.

        A **@Challenger** is available but not hired: ask for a critical review when you want the weak ideas killed.

        Tell me the product you want to explore.
      entry_point:
        card:
          __ref__: human_proxy
      members:
      - card:
          __ref__: product_manager
        members:
        - card:
            __ref__: product_composer
        - card:
            __ref__: product_connector
        - card:
            __ref__: product_capability_engineer
        - card:
            __ref__: product_context_manager
      message_types:
      - __type__: akgentic.agent.messages.AgentMessage
      agent_profiles:
      - __ref__: challenger
