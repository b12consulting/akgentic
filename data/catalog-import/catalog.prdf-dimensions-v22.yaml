  framework_method:
    kind: model
    model_type: akgentic.catalog.NativeValue
    description: The PrDF as a method — dimensions named and owned, no dimension content
    payload:
      value: |
        ## THE PRODUCT DIGITIZATION FRAMEWORK — METHOD

        Developed by Prof. Steve Muylle and Dr Willem Standaert (Vlerick Business School) and Prof. Amit Basu (SMU Cox), as part of the Accenture Belux — Vlerick Digital 20/20 Chair. It identifies opportunities to digitize any product or service, and is tied to no particular technology or industry.

        It has **four dimensions**, and in this team each is owned by exactly one specialist:

        | Dimension | Question | Owner |
        |---|---|---|
        | **Composition** | What is the product, what is it made of, how is it structured? | `@ProductComposer` |
        | **Connectivity** | What does it connect to — local user, local environment, cloud? | `@ProductConnector` |
        | **Capabilities** | What can it sense, process and learn — to inform, change state, improve? | `@ProductCapabilityEngineer` |
        | **User experience** | Who interacts with it, in which use context, and how does that change? | `@ProductContextManager` |

        The first three dimensions are **orthogonal**: for every element of the composition, several connectivity scopes can be established, and several levels of capability developed. That is why a question about "the product" is usually really a question about one element, in one scope, at one level — and part of your job is to make the request that specific before you send it.

        ### Entering the framework

        Digitization can be entered from either end:

        - **From experience** — pick a use context and a stakeholder, then derive the composition, connectivity and capability requirements that would improve or transform it.
        - **From technology** — start from a component or sub-system that a new technology touches, then work out the consequences in the other three dimensions.

        When the user expresses no preference, the default order is:
        **use context → composition → connectivity and capabilities → experience impact.**

        ### What you do not hold

        This section is the whole of what you know about the framework. **You do not hold the content of the four dimensions** — each specialist holds one of them in full, and you hold none. Any dimension analysis you write yourself will be thinner than the specialist's, and writing it is a failure of your role rather than a shortcut.
  framework_composition:
    kind: model
    model_type: akgentic.catalog.NativeValue
    description: PrDF — the composition dimension, in full
    payload:
      value: |
        ## YOUR DIMENSION — COMPOSITION

        The composition dimension addresses: *What is the product? What is it made of? How is it structured? What is the product architecture, or the service blueprint?*

        In the framework, **each product is a system**, which can consist of one or more sub-systems, which in turn can consist of one or more sub-systems, in a composition hierarchy down to specific **components**.

        Digitizing a product, sub-system or component may convert it from an **analog** system (tangible, electromechanical) into a **digital** one. A song, which is a sequence of audio waves, becomes a stream of electronic waves when digitized. Whenever a digital artefact must be experienced or acted on by a physical system or a person, a **digital-to-physical interface** is required — naming that interface is part of your job.

        ### Worked example — a suitcase

        The composition is: **Suitcase** → sub-systems **Lock**, **Handle**, **Casing**, **Wheels**. One sub-system broken down further: **Casing** → components **Outside Surface**, **Inside Surface**, **ID Pouch**.

        Digitization can be established at any of the three levels:

        - at **sub-system** level — the Lock becomes a *Digital Lock*;
        - at **component** level — the ID Pouch becomes a *Digital Identifier*: an electronic luggage tag with a rugged display, replacing the paper tag printed at an airport kiosk;
        - at **whole-product** level, where the entire artefact becomes digital.

        The suitcase example is the framework's own illustration. Use its *shape* — system, sub-systems, components, one branch expanded — never its content, unless the product actually is a suitcase.

        ### What good decomposition looks like

        - Sub-systems are separable by **function**, not by material or by manufacturing step.
        - Expand one branch deeply rather than every branch shallowly — the interesting digitization is usually one level below where people stop.
        - Mark each element **analog** or **already digital**. The analog ones are where the opportunity is.
        - A component nobody would think to name is often the best candidate. The ID Pouch is a paper sleeve; it is also the single highest-value digitization in the whole suitcase.
  framework_connectivity:
    kind: model
    model_type: akgentic.catalog.NativeValue
    description: PrDF — the connectivity dimension, in full
    payload:
      value: |
        ## YOUR DIMENSION — CONNECTIVITY

        The connectivity dimension refers to **the type of connections that exist between the product and its environment**. The entities a product can connect to form three nested scopes:

        1. **Local user** — the person with direct physical access to the product. Reached through the digital-to-physical user interface.
        2. **Local environment** — other users, products and systems in the vicinity of the product.
        3. **Cloud** — a remotely located user, the producer, or any other entity, product or system anywhere in the world.

        ### Worked example — a suitcase

        - **Local user**: connects to the digital lock through the digital-to-physical interface — (de)activating the lock, and perceiving its status (open/closed, current combination).
        - **Local environment**: a sensor that detects airport law-enforcement handling, and an actuator that releases the lock for security inspection.
        - **Cloud**: the owner remotely detects the lock status, or receives an alert when someone tampers with the lock.

        Note the second interface in that example: the digital lock must also connect **to the rest of the product**, through a physical locking mechanism. A digitized element almost always needs two interfaces — one outward, one into the product it belongs to. Naming both is part of your job.

        For the digital identifier on the same suitcase, connectivity to the local environment lets the bag be checked in at an airline counter; cloud connectivity lets the owner track its location at all times and update the tag remotely.

        ### What good connectivity work looks like

        - Answer all three scopes for each element, and say **not applicable, because…** rather than silently skipping one.
        - State what is exchanged **in each direction** — a product that only reports is far less valuable than one that can also be told something.
        - Connectivity is what turns data into value: an element that senses but cannot connect informs nobody.
        - Be honest about cost and power. A connection that needs a battery the product cannot carry is not an opportunity.
  framework_capabilities:
    kind: model
    model_type: akgentic.catalog.NativeValue
    description: PrDF — the capabilities dimension, in full
    payload:
      value: |
        ## YOUR DIMENSION — CAPABILITIES

        The capabilities of a product are **reliant on its composition and its connectivity**. Digitized components, sub-systems or products generate data; if the product is connected, that data can be used to enhance the product's capabilities and the value they carry.

        There are three levels, each pairing an input capability with what it delivers:

        | The product can… | …through | …in order to |
        |---|---|---|
        | **Sense** the data | sensors | **Inform** the user or the environment |
        | **Process** the data | programming logic | **Change the state** of the product, through actuators |
        | **Learn** from the data | machine-learning algorithms | **Improve** the performance of the product |

        The levels are a ladder of increasing sophistication, and each rests on the one below.

        ### Worked example — a suitcase lock

        - **Sense → Inform**: sense the lock status and inform the user or the environment about it.
        - **Process → Change of state**: remotely lock the suitcase — data is processed, and the physical state changes.
        - **Learn → Improve**: the locking system learns to add authorized users and give them access automatically, while blocking unauthorized ones.

        And on the same suitcase's digital identifier: sensing the travel destination and informing through the display tag; processing a routing change and updating the tag digitally; and, across several bags on one journey belonging to different family members, **learning that they belong together** and syncing all their tags to the same destination.

        That last one is the shape of a good *learn* capability: it emerges from data across units or across time, and no single unit could produce it alone.

        ### What good capability work looks like

        - Walk the ladder in order. A *learn* capability proposed without the *sense* beneath it is not an opportunity, it is a wish.
        - Name the actual sensor, the actual actuator, the actual data. "AI-powered optimisation" is not a capability.
        - Say which rung is reachable today at acceptable cost, and which needs connectivity or volume the product does not yet have.
        - The three dimensions are orthogonal: for each composition element, several connectivity scopes are possible, and at each scope several levels of capability.
  framework_experience:
    kind: model
    model_type: akgentic.catalog.NativeValue
    description: PrDF — the user experience dimension, in full
    payload:
      value: |
        ## YOUR DIMENSION — USER EXPERIENCE

        The user experience dimension refers to **how the user experiences the product** — where "the user" is anyone who interacts with it. That includes the owner-customer, the seller-producer, the servicer-maintenance worker, and anyone else who touches the product across its life.

        Product digitization may not only **impact** the experience of one or more users; it may **expand** it, by adding capabilities that precede or succeed the current moment of use.

        ### Worked example — a suitcase

        The primary user is the person who travels with it. Additional users are relatives, airport personnel handling baggage, border and security control, and — when maintenance is required — the technicians who repair it. Digitization may affect any number of these experiences at once.

        The air-travel experience around the suitcase runs: *book flight (baggage info) → passenger online check-in → baggage check-in → baggage drop-off → flight → boarding → baggage pick-up at destination.* Travellers can already get a mobile boarding pass before going to the airport, yet their luggage still needs a **paper tag**, printed at a kiosk or a counter. Digitizing the ID pouch into an electronic tag removes that step.

        And the value spreads beyond the traveller: for the **manufacturer** a digital identifier is differentiation, expanded value and switching costs; for the **airline** it is efficiency, since tags are already in place and manual handling becomes redundant; for **border and security agencies** it can carry pre-filled reporting forms on the display. All of which reduces the stress of air travel for the traveller.

        That spread is the point of this dimension: **the strongest digitization case is usually the one that pays off for several stakeholders at once.**

        ### What good experience work looks like

        - A **use context** is a situation, not a market segment. Name the intended user, when the context applies, and the likely outcomes of use.
        - Contexts must be genuinely distinct — different trigger, different user, or different outcome. Three levels of detail on the same context is one context.
        - For every context, ask who *else* touches the product: owner, servicer, producer, seller, regulator, bystander.
        - Look **before and after** the moment of use. The suitcase case is won at check-in and at baggage claim, not while the bag is being carried.
  framework_core:
    kind: model
    model_type: akgentic.catalog.NativeValue
    description: PrDF — condensed, all four dimensions
    payload:
      value: |
        ## THE PRODUCT DIGITIZATION FRAMEWORK — CONDENSED

        Four dimensions, applicable to any product or service.

        **1. Composition** — the product is a *system*, made of *sub-systems*, made of *components*. Digitization can happen at any level, converting an analog (tangible, electromechanical) element into a digital one. A digital-to-physical interface is required wherever a person or a physical system must interact with the digital artefact.

        **2. Connectivity** — three nested scopes: the **local user** (direct access, through the digital-to-physical interface), the **local environment** (users, products and systems nearby), and the **cloud** (remote user, producer, or anything anywhere).

        **3. Capabilities** — a ladder, each rung resting on the one below:
        - **Sense** (sensors) → **Inform** the user or environment
        - **Process** (programming logic) → **Change state**, through actuators
        - **Learn** (machine learning) → **Improve** performance

        **4. User experience** — how anyone who interacts with the product experiences it: owner-customer, seller-producer, servicer, regulator, bystander. Digitization can both *impact* an experience and *expand* it, by adding capabilities before and after the current moment of use.

        The first three dimensions are **orthogonal**: for each composition element, several connectivity scopes are possible, and at each scope several levels of capability. The strongest opportunities usually pay off for **several stakeholders at once**.

        *Framework: Muylle, Standaert (Vlerick) and Basu (SMU Cox) — Accenture Belux / Vlerick Digital 20/20 Chair, 2018.*
  graph_schemas:
    kind: model
    model_type: akgentic.catalog.NativeValue
    description: Knowledge graph schema — four PrDF dimensions, with provenance-carrying observations
    payload:
      value: |
        === START SCHEMA =====================================================

        This graph is the RECORD OF THE ANALYSIS. Work at 20-30 nodes. Every node carries a
        substantive `description` (2-3 sentences, never a restatement of the name) and
        `observations` that hold the discussion.

        ## Observation vocabulary — use these prefixes

        "Reported by @X: ..."    what that specialist established. ALWAYS present.
        "Confirmed by @X: ..."   a peer checked it and it held (the output of a consultation)
        "Contested by @X: ..."   a peer disagreed, unresolved — record it, never drop it
        "Revised: ..."           what changed after a consultation, and why
        "Evidence: ..."          a grounded external fact: a cost, a standard, a product
        "Open: ..."              what is still unknown, and who would settle it

        ## Core Entities

        (:Product) - Singleton, the product being analysed.
        - name, description (what it is, and what is being asked about it)

        (:UseContext) - A situation in which the product is used. Only the context(s) in play.
        - name, description
        - Observations: "When: <trigger>", "Outcome: <what the user gets>", + vocabulary above

        (:Stakeholder) - Anyone who interacts with the product in that context.
        - name, description
        - Observations: "Type_Owner"|"Type_Servicer"|"Type_Producer"|"Type_Commercial"|"Type_Regulator"|"Type_Other"

        (:SubSystem) - Sub-elements of the product; may nest. Only those being examined.
        - name, description (its function, and why it is a digitization candidate or not)
        - Observations: "State_Analog"|"State_Digital", + vocabulary above

        (:Component) - Leaf elements. Only those being examined.
        - name, description
        - Observations: "State_Analog"|"State_Digital", + vocabulary above

        (:Capability) - A digital feature enabled by a component or sub-system.
        - name, description (what it senses/processes/learns, and what it delivers)
        - Observations: "Function_Sense"|"Function_Process"|"Function_Learn", + vocabulary above

        (:Local_User), (:Local_Environment), (:Cloud) - Connectivity scopes. Create one only
          when a capability actually reaches it.
        - name, description (the interface, and what is exchanged over it)

        ## Relationships — give each a one-line description of what the link means

        (:Product)-[:USED_IN]->(:UseContext)
        (:UseContext)-[:INVOLVES]->(:Stakeholder)
        (:Product)-[:HAS_SUB_SYSTEM]->(:SubSystem)
        (:SubSystem)-[:HAS_SUB_SYSTEM]->(:SubSystem)
        (:SubSystem)-[:HAS_COMPONENT]->(:Component)
        (:Component)-[:SUPPORTS]->(:Capability)
        (:SubSystem)-[:SUPPORTS]->(:Capability)
        (:Capability)-[:INTERACTS_WITH]->(:Local_User|:Local_Environment|:Cloud)
        (:Stakeholder)-[:EXPERIENCES]->(:Capability)

        === END SCHEMA ========================================================
  id_knowledge_graph:
    kind: tool
    model_type: akgentic.tool.knowledge_graph.KnowledgeGraphTool
    description: Knowledge graph — full read/write access for the Product Manager
    payload:
      update_graph:
        instructions: |
          This graph is where the analysis is kept, and the user watches it while you work.
          A node whose description repeats its own name is worthless. Put the substance in.

          BEFORE you delete anything, copy those nodes' descriptions and observations into
          analysis-log.md verbatim. Pruning is only safe because that file exists.

          Work at 20-30 nodes. Do NOT prune early - below 20 you are under-recording. Only
          past ~30 remove the least relevant, and prefer merging two thin nodes into one
          substantive node over deleting a real finding.

          Every node needs:
          - description: two or three sentences of substance - what it is, what it does, why
            it matters here. Never a restatement of the name.
          - observations: the discussion itself, one line each, prefixed:
              "Reported by @X: ..."   what that specialist established (ALWAYS present)
              "Confirmed by @X: ..."  a peer checked it and it held
              "Contested by @X: ..."  a peer disagreed, unresolved - record it, never drop it
              "Revised: ..."          what changed after a consultation and why
              "Evidence: ..."         a grounded external fact - a cost, a standard, a product
              "Open: ..."             what is still unknown, and who would settle it
            plus the typed flags: State_Analog / State_Digital, Function_Sense /
            Function_Process / Function_Learn.

          Give relations a description too - one line on what the link means.

          After every peer consultation between two specialists, record its outcome as a
          Confirmed / Contested / Revised observation. That exchange is the most valuable
          content the team produces; losing it wastes the consultation.

          Grow nodes with update_entities + add_observations rather than replacing them. A
          node should get richer each time the team touches it. Prune nodes, never provenance.
  id_knowledge_graph_ro:
    kind: tool
    model_type: akgentic.tool.knowledge_graph.KnowledgeGraphTool
    description: Knowledge graph — read-only access for the specialists
    payload:
      read_only: true
      get_graph:
        instructions: |
          This is the record of the analysis so far, and the observations carry who
          established what: "Reported by @X", "Confirmed by @X", "Contested by @X",
          "Evidence", "Open".

          Read them before you answer. A "Confirmed by" line means a peer already checked
          that point — do not re-litigate it. A "Contested by" or "Open" line is exactly
          where your contribution is worth most.

          Reuse the names recorded here rather than inventing new ones for the same thing,
          and never silently contradict the graph: if you disagree with something recorded,
          say so explicitly in your reply so it is captured as a Contested observation.
  id_planning:
    kind: tool
    model_type: akgentic.tool.planning.PlanningTool
    description: Task board — the Product Manager's dispatch and gather ledger
    payload:
      update_planning:
        instructions: |
          This board is how you know whether you are still waiting.

          Create ONE task per specialist request the moment you dispatch it, with that
          specialist as the owner and the question as the description. Mark it done the moment
          that specialist replies.

          Before you send anything to @Human, read the board. If any task is still open, you
          are waiting: send nothing and stop. Only when every task is done do you integrate
          the replies and answer the user.
  id_search_composition:
    kind: tool
    model_type: akgentic.tool.search.SearchTool
    description: Web search — tuned for product architecture and teardowns
    payload:
      web_fetch: false
      web_crawl: false
      web_search:
        max_results: 3
        instructions: |
          At most TWO searches this turn. Every result stays in context for the rest of the
          turn, so a fourth search costs more than it adds — search wide once, not narrow
          four times.

          Search for how this product is actually built: teardowns, exploded views, parts
          catalogues, repair manuals, patent filings, service documentation. You are after the
          real part list and the real architecture, not marketing copy. Prefer a repair guide
          over a product page.
  id_search_connectivity:
    kind: tool
    model_type: akgentic.tool.search.SearchTool
    description: Web search — tuned for interfaces, protocols and connected products
    payload:
      web_fetch: false
      web_crawl: false
      web_search:
        max_results: 3
        instructions: |
          At most TWO searches this turn. Every result stays in context for the rest of the
          turn, so a fourth search costs more than it adds — search wide once, not narrow
          four times.

          Search for connectivity that already exists in this product category: which models
          are connected, over which protocols (BLE, Wi-Fi, NFC, LoRa, UWB, cellular), what
          their apps actually do, and what the reported range, battery and cost consequences
          are. Prefer specifications and teardowns over vendor claims.
  id_search_capabilities:
    kind: tool
    model_type: akgentic.tool.search.SearchTool
    description: Web search — tuned for sensors, actuators and applied machine learning
    payload:
      web_fetch: false
      web_crawl: false
      web_search:
        max_results: 3
        instructions: |
          At most TWO searches this turn. Every result stays in context for the rest of the
          turn, so a fourth search costs more than it adds — search wide once, not narrow
          four times.

          Search for the sensing, actuation and learning technologies realistically available
          for this product category: sensor types and unit costs, actuator options, on-device
          versus cloud inference, and published examples of predictive or adaptive behaviour in
          comparable products. You need what is affordable today, not what is possible in
          principle.
  id_search_experience:
    kind: tool
    model_type: akgentic.tool.search.SearchTool
    description: Web search — tuned for users, journeys and complaints
    payload:
      web_fetch: false
      web_crawl: false
      web_search:
        max_results: 3
        instructions: |
          At most TWO searches this turn. Every result stays in context for the rest of the
          turn, so a fourth search costs more than it adds — search wide once, not narrow
          four times.

          Search for how people actually live with this product: user reviews and complaints,
          forum threads, journey and process descriptions, and the roles of the professionals
          who sell, service, inspect or dispose of it. Complaints are the richest source —
          they name the moments where the experience currently fails.
  id_search_challenge:
    kind: tool
    model_type: akgentic.tool.search.SearchTool
    description: Web search — tuned for prior art and failed attempts
    payload:
      web_fetch: false
      web_crawl: false
      web_search:
        max_results: 3
        instructions: |
          At most TWO searches this turn. Every result stays in context for the rest of the
          turn, so a fourth search costs more than it adds — search wide once, not narrow
          four times.

          Search for evidence that would REFUTE the opportunity under review: products already
          on the market that do this, companies that tried it and withdrew, published costs
          that make it uneconomic, regulations that forbid it. An existing product is the
          strongest possible objection — look for it first.
  id_run_limits_chair:
    kind: model
    model_type: akgentic.llm.RunUsageLimits
    description: 'Per-run brake for the coordinator: 30 requests, 20 tool calls, 300k tokens. Bounds ONE
      reasoning turn.'
    payload:
      run_request_limit: 30
      tool_calls_limit: 20
      total_tokens_limit: 300000
  id_agent_limits_chair:
    kind: model
    model_type: akgentic.llm.AgentUsageLimits
    description: 'Lifetime budget for the coordinator: 100 runs, 1M tokens. Bounds the whole session.'
    payload:
      agent_request_limit: 100
      total_tokens_limit: 1000000
  id_run_limits_member:
    kind: model
    model_type: akgentic.llm.RunUsageLimits
    description: 'Per-run brake for a member: 30 requests, 25 tool calls, 200k tokens. Sized from measurement
      — a legitimate turn used 6 tool calls; a runaway search loop reached 27 calls and 1.1M tokens in
      a single run.'
    payload:
      run_request_limit: 30
      tool_calls_limit: 25
      total_tokens_limit: 200000
  id_agent_limits_member:
    kind: model
    model_type: akgentic.llm.AgentUsageLimits
    description: 'Lifetime budget for a member: 50 runs, 500k tokens. Bounds the whole session even if
      every individual run stays under its own cap.'
    payload:
      agent_request_limit: 50
      total_tokens_limit: 500000
  id_team_member:
    kind: tool
    model_type: akgentic.tool.team.TeamTool
    description: Team awareness for a member — roster only. No hiring, no firing, no activity polling.
    payload:
      hire_team_members: false
      fire_team_members: false
      get_team_activity: false
      get_role_profiles: false
      get_team_roster: true
  id_team_chair:
    kind: tool
    model_type: akgentic.tool.team.TeamTool
    description: Team management for the coordinator — hire/fire, roster, profiles and the activity report.
    payload: {}
  id_workspace_chair:
    kind: tool
    model_type: akgentic.tool.workspace.WorkspaceTool
    description: The coordinator's working files — an append-only analysis log and the report. Deliberately
      narrow, with no delete, no patch and no search.
    payload:
      workspace_delete: false
      workspace_glob: false
      workspace_grep: false
      workspace_view: false
      workspace_patch: false
      workspace_multi_edit: false
      workspace_mkdir: false
      workspace_write:
        instructions: |
          You maintain two files, and they are the only durable record of this session.

          analysis-log.md is APPEND-ONLY. Never rewrite an earlier entry. Add a block each
          turn covering who you asked, what came back, what was settled or contested, and
          what you told the user.

          IMPORTANT. Before you call delete_entities on the knowledge graph, write the full
          content of every node you are about to remove into analysis-log.md - its
          description and all of its observations, verbatim. The graph is curated and loses
          things by design; this file is what makes that safe.

          report.md is the deliverable. Rewrite it whenever the user asks for a report, or
          when the analysis reaches a natural conclusion. Build it from analysis-log.md
          rather than from memory.
      workspace_read:
        instructions: |
          Read analysis-log.md before writing a report, and whenever you need something the
          knowledge graph no longer holds. This file remembers what the graph pruned.
  id_vector_store:
    kind: tool
    model_type: akgentic.tool.vector_store.VectorStoreTool
    description: Vector store singleton backing semantic search in the graph and the plan
    payload: {}
