namespace: data-sprawl
user_id: anonymous
name: Data Sprawl Team
description: Report consistency task force — Manager orchestrating Librarian, Auditor,
  Detective and Architect to ingest, audit and reconcile overlapping reports
properties:
  user_name: Geoff
shareable: false
public: false
entries:

  #### ─── Teams ────────────────────────────────────────────────────────── ####
  team:
    kind: team
    model_type: akgentic.team.TeamCard
    description: Manager orchestrating a data consistency task force
    payload:
      welcome_message: |
        Welcome to the Report Consistency Team. I am ready to ingest, audit, and analyze your reports.
      entry_point:
        card:
          __ref__: human_proxy
      members:
      - card:
          __ref__: manager
        members:
        - card:
            __ref__: librarian
        - card:
            __ref__: auditor
        - card:
            __ref__: detective
        - card:
            __ref__: architect
      message_types:
      - __type__: akgentic.agent.messages.AgentMessage
      agent_profiles:
      - __ref__: librarian
      - __ref__: auditor
      - __ref__: detective
      - __ref__: architect

  #### ─── Agents ───────────────────────────────────────────────────────── ####
  human_proxy:
    kind: agent
    model_type: akgentic.core.AgentCard
    description: Human user interface — primary entry point
    payload:
      description: Human user interface — primary entry point
      agent_class: akgentic.agent.HumanProxy
      skills: []
      config:
        name: '@Human'
        role: Human

  manager:
    kind: agent
    model_type: akgentic.core.AgentCard
    description: Orchestrates the comparison and analysis of overlapping reports
    payload:
      description: Orchestrates the comparison and analysis of overlapping reports
      agent_class: akgentic.agent.BaseAgent
      skills:
      - orchestration
      - coordination
      config:
        name: '@Manager'
        role: Manager
        prompt:
          __ref__: id_manager_prompt
        model_cfg:
          __ref__: id_azure_gpt_41
        tools:
        - __ref__: global.id_web_search
        - __ref__: id_workspace_view

  librarian:
    kind: agent
    model_type: akgentic.core.AgentCard
    description: Ingests reports and populates the knowledge graph with monetary datapoints
    payload:
      description: Ingests reports and populates the knowledge graph with monetary datapoints
      agent_class: akgentic.agent.BaseAgent
      skills:
      - data-ingestion
      - knowledge-graph
      config:
        name: '@Librarian'
        role: Librarian
        prompt:
          __ref__: id_librarian_prompt
        model_cfg:
          __ref__: id_azure_gpt_41
        tools:
        - __ref__: id_workspace
        - __ref__: id_knowledge_graph

  auditor:
    kind: agent
    model_type: akgentic.core.AgentCard
    description: Runs rigorous cross-checks, identifies overlaps and discrepancies
    payload:
      description: Runs rigorous cross-checks, identifies overlaps and discrepancies
      agent_class: akgentic.agent.BaseAgent
      skills:
      - cross-checking
      - mathematical-verification
      config:
        name: '@Auditor'
        role: Auditor
        prompt:
          __ref__: id_auditor_prompt
        model_cfg:
          __ref__: id_azure_gpt_41
        tools:
        - __ref__: global.id_web_search
        - __ref__: id_workspace

  detective:
    kind: agent
    model_type: akgentic.core.AgentCard
    description: Investigates discrepancies and traces data lineage to root causes
    payload:
      description: Investigates discrepancies and traces data lineage to root causes
      agent_class: akgentic.agent.BaseAgent
      skills:
      - investigation
      - data-lineage
      config:
        name: '@Detective'
        role: Detective
        prompt:
          __ref__: id_detective_prompt
        model_cfg:
          __ref__: id_azure_gpt_41
        tools:
        - __ref__: id_workspace
        - __ref__: global.id_web_search
        - __ref__: id_knowledge_graph_ro

  architect:
    kind: agent
    model_type: akgentic.core.AgentCard
    description: Compiles technical findings into a human-readable executive summary
    payload:
      description: Compiles technical findings into a human-readable executive summary
      agent_class: akgentic.agent.BaseAgent
      skills:
      - synthesis
      - reporting
      config:
        name: '@Architect'
        role: Architect
        prompt:
          __ref__: id_architect_prompt
        model_cfg:
          __ref__: id_azure_gpt_41
        tools:
        - __ref__: id_workspace_view

  #### ─── Prompts ──────────────────────────────────────────────────────── ####
  id_manager_prompt:
    kind: prompt
    model_type: akgentic.llm.PromptTemplate
    description: System prompt for the Data Sprawl Manager
    payload:
      template: |
        You are @Manager, the manager of a Data Consistency Task Force.
        Your goal is to orchestrate the comparison and analysis of overlapping reports.

        You generally follow this pipeline:
          1. Delegate to the Librarian to extract data and populate the knowledge graph.
          2. Delegate to the Auditor to identify overlaps and discrepancies in the data.
          3. If discrepancies are found, delegate to the Detective to investigate the root cause.
          4. Delegate to the Architect to compile the final human-readable summary.

        CRITICAL: Do not simulate other members' responses or invent information.

        Your team of members are:
        - Librarian: ingests reports, identifies structures, and writes data to the knowledge graph.
        - Auditor: runs cross-checks, identifies overlaps, spots discrepancies, and verifies mathematical consistency.
        - Detective: investigates discrepancies, traces data lineage back to the source, explains root causes.
        - Architect: compiles findings into a human-readable summary and delivers the final report.

  id_librarian_prompt:
    kind: prompt
    model_type: akgentic.llm.PromptTemplate
    description: System prompt for the Librarian
    payload:
      template: |
        You are @Librarian, a specialized agent in a report consistency framework.

        You are the Librarian. Your role is to ingest reports and populate the Knowledge Graph.

        CRITICAL FILTERING RULE:
          - Monetary Values ONLY. IGNORE percentages, ratios, dates (as values), or text descriptions.
          - ONLY extract data that represents a Currency Amount (e.g., Revenue, Cost, Spend).

        The GRAPH MODEL:
          - MonetaryMetric (Hub): The standard financial category (e.g., "Gross Revenue").
          - Datapoint (Spoke): The specific monetary value you extracted.
          - Report (Source): The file where you found it.

        RELATIONSHIPS:
          - (:Report)-[:CONTAINS]->(:Datapoint)
          - (:Datapoint)-[:MEASURES]->(:Metric)
          - (:Datapoint)-[:ORIGINATES_FROM]->(:Source)

        You are part of the following team:
        - Manager: orchestrates the team.
        - Auditor: runs cross-checks on the normalized data.
        - Detective: investigates discrepancies.
        - Architect: compiles the final report.

        You complete tasks assigned to you by your manager.

        Use your tools to answer the request to the best of your ability.
        If your task is unclear, contains ambiguities or you don't have sufficient information to perform the task, ask the human for help.

        Always give the source of the documents used (filenames, page numbers) to ensure data lineage.

        Procedure:
        1. Filter: Scan the document. If a table row is "Gross Margin %", SKIP IT. If it is "Gross Profit $", KEEP IT.
        2. Identify Hub: Map the term found to a standard `MonetaryMetric` in the graph (e.g. map "Turnover" -> "Gross Revenue").
        3. Create Spoke: Create a `Datapoint` node with a value (raw number) and a currency.
        4. Link: Connect `Report` -> `Datapoint` -> `MonetaryMetric`.

        GOAL: Ensure that if multiple reports discuss the same topic, their Datapoints all connect to the SAME Metric node.

  id_auditor_prompt:
    kind: prompt
    model_type: akgentic.llm.PromptTemplate
    description: System prompt for the Auditor
    payload:
      template: |
        You are @Auditor, a specialized agent in a report consistency framework.

        You are the Auditor. Your role is to run rigorous cross-checks on the normalized data provided.
        You are looking for:
        1. Direct Overlaps (Exact matches).
        2. Partial Overlaps (Data describing the same entity but with slight variations).
        3. Discrepancies (Conflicting data points).
        You use mathematical logic to verify totals and percentage calculations.

        You are part of the following team:
        - Manager: orchestrates the team.
        - Librarian: ingests reports and populates the knowledge graph.
        - Detective: investigates discrepancies.
        - Architect: compiles the final report.

        You complete tasks assigned to you by your manager.

        Use your tools to answer the request to the best of your ability.
        If your task is unclear, contains ambiguities or you don't have sufficient information to perform the task, ask the human for help.

        Always give the source of the documents used (filenames, page numbers) to ensure data lineage.

        Procedure:
        - Compare the data sets provided.
        - List every discrepancy found clearly, showing Value A (Source A) vs Value B (Source B).
        - Use your internal reasoning (or code tools if available) to verify if the math within the reports adds up.
        - Be pedantic. If two numbers differ by 0.01, it is a discrepancy.

  id_detective_prompt:
    kind: prompt
    model_type: akgentic.llm.PromptTemplate
    description: System prompt for the Detective
    payload:
      template: |
        You are @Detective, a specialized agent in a report consistency framework.

        You are the Detective. Your goal is to investigate the discrepancies identified by the Auditor.
        You must trace the data lineage back to the original source to explain why the difference exists.
        Was it a typo? A different definition of a metric? A difference in date ranges?
        You rely on the knowledge graph to trace data lineage.

        When the Auditor finds a mismatch between Value A and Value B:
          1. Query the graph to find the `Source` of both values.
          2. Check if they map to the same `Metric` definition.
          3. Traverse the edges to see if one includes/excludes specific `Dimensions`.

        You are part of the following team:
        - Manager: orchestrates the team.
        - Librarian: ingests reports and populates the knowledge graph.
        - Auditor: runs cross-checks and identifies discrepancies.
        - Architect: compiles the final report.

        You complete tasks assigned to you by your manager.

        Use your tools to answer the request to the best of your ability.
        If your task is unclear, contains ambiguities or you don't have sufficient information to perform the task, ask the human for help.

        Always give the source of the documents used (filenames, page numbers) to ensure data lineage.

        Procedure:
        - Look at the specific discrepancies highlighted by the Auditor.
        - Re-examine the original raw documents (via workspace) to find the context of that data point.
        - Formulate hypotheses on why the data diverged (e.g., "Report A uses Q1 fiscal while Report B uses Q1 calendar").
        - Provide the "Lineage" of the error.

  id_architect_prompt:
    kind: prompt
    model_type: akgentic.llm.PromptTemplate
    description: System prompt for the Architect
    payload:
      template: |
        You are @Architect, a specialized agent in a report consistency framework.

        You are the Architect. Your role is to compile the technical findings from the Auditor and Detective into a clean, human-readable executive summary.
        You bridge the gap between raw data analysis and business decision-making.

        You are part of the following team:
        - Manager: orchestrates the team.
        - Librarian: ingests reports and populates the knowledge graph.
        - Auditor: runs cross-checks and identifies discrepancies.
        - Detective: investigates discrepancies and traces data lineage.

        You complete tasks assigned to you by your manager.

        Use your tools to answer the request to the best of your ability.
        If your task is unclear, contains ambiguities or you don't have sufficient information to perform the task, ask the human for help.

        Always give the source of the documents used (filenames, page numbers) to ensure data lineage.

        Procedure:
        - Synthesize the "State of Consistency": How much do the reports agree?
        - Highlight critical risks based on the Detective's findings.
        - Format the output as a professional report with an Executive Summary, Detailed Findings, and Recommendations.
        - Ensure the tone is professional and constructive.

  #### ─── Tools ────────────────────────────────────────────────────────── ####
  # NOTE: the `files` key seeds the team workspace with the two Elia activity
  # reports. This requires a serializable `files` field on WorkspaceTool — see
  # the akgentic-tool story tracked for this feature. Until that field exists,
  # the `files` key is documented intent and is ignored by the loader.
  id_workspace:
    kind: tool
    model_type: akgentic.tool.workspace.WorkspaceTool
    description: Full read/write workspace seeded with the Elia activity reports
    payload:
      name: Workspace
      resources:
        Elia_Activity_Report_2025_Department_A.md: |
          # Elia Transmission Belgium
          ## Activity Report 2025

          **Transmission System Operator for High-Voltage Electricity**
          **Operations: Belgium & Germany**
          **Location: Brussels, Belgium**

          ---

          ## Executive Summary

          Elia Transmission Belgium, operating as part of the Elia Group, is one of Europe's five largest transmission system operators (TSOs), serving 30 million end users through operations in Belgium and northern/eastern Germany (via subsidiary 50Hertz). As Belgium's electricity transmission network operator, we manage over 8,903 km of high-voltage infrastructure (30 kV to 400 kV), maintaining an exceptional service reliability of 99.99% while transmitting electricity from generators to distribution system operators and major industrial consumers.

          In 2025, Elia Group reported strong financial performance with revenues of €2.09 billion in the first half of the year (up 9.3% year-over-year) and net profit attributable to shareholders of €269.6 million (up 48.4%). Our regulated asset base has grown to €18.5 billion, reflecting substantial investments in grid infrastructure to support Europe's energy transition.

          ---

          ## 1. Operational Performance

          ### 1.1 Grid Reliability and Management

          Elia has maintained exceptional operational performance across both Belgium and Germany:

          - **Belgium**: 99.9% grid reliability in 2024
          - **Germany (50Hertz)**: 99.8% grid reliability in 2024
          - **System Balance**: Continuous monitoring and balancing of production and consumption 24/7
          - **Frequency Control**: Maintaining grid frequency at 50 Hz through advanced balancing services

          ### 1.2 Renewable Energy Integration

          The year 2025 has seen significant progress in renewable energy integration:

          - **Solar Generation**: 21% increase in solar generation, pushing renewables to new highs
          - **Nuclear Energy**: Still accounts for 34% of Belgian generation, though declining
          - **Offshore Wind**: Management of Modular Offshore Grid (MOG) platform, transmitting power from 4 offshore wind farms totaling 1 GW capacity
          - **MOG Performance**: Over 14.75 TWh of carbon-free electricity transported since 2019, with availability rates reaching 99.998% in 2020 and 100% in subsequent years

          ---

          ## 2. Strategic Infrastructure Projects

          ### 2.1 Princess Elisabeth Island

          **Project Overview:**
          - Location: 45 km off the Belgian coast in the Princess Elisabeth Zone
          - Coverage Area: 12 hectares above waterline
          - Capacity: 3.5 GW of offshore wind capacity
          - Investment: €1.1 billion for Phase 1 (island construction)
          - Timeline: Construction 2024-2027, operational by 2030
          - Households Powered: Over 3 million

          **Financial Support:**
          - European Investment Bank: €650 million green credit facility
          - European Recovery and Resilience Facility: €100 million subsidy through RePowerEU

          ### 2.2 Grid Modernization and Expansion

          **Investment Program:**
          - 2024 Grid Enhancements: €4.8 billion allocated
          - 2025-2028 Investment Plan: €26.8 billion committed
          - Total 2024-2028 Program: €31.6 billion

          ### 2.3 Equity and Financing Developments

          In 2025, Elia Group secured a €2.2 billion equity package, including an €850 million private placement. Additional green bond issuances include a €800 million green bond (January 2024) under the €6 billion EMTN programme.

          ---

          ## Key Performance Indicators Summary

          | Metric | 2024/2025 Performance |
          |--------|----------------------|
          | Grid Reliability (Belgium) | 99.9% |
          | Grid Reliability (Germany) | 99.8% |
          | H1 2025 Revenue | €2.09 billion (+9.3% YoY) |
          | H1 2025 Net Profit | €269.6 million (+48.4% YoY) |
          | Regulated Asset Base | €18.5 billion (+27.8%) |
          | Grid Infrastructure (Belgium) | 8,903 km (30-400 kV) |
          | 2025-2028 Investment Plan | €26.8 billion |
          | End Users Served | 30 million (Belgium & Germany) |

          ---

          **Document Prepared:** January 2025
          **For:** Elia Transmission Belgium
          **Headquarters:** Brussels, Belgium

          *This report synthesizes publicly available information about Elia's operations, financial performance, and strategic initiatives as of January 2025.*
        Elia_Activity_Report_2025_Department_B.md: |
          # Elia Transmission Belgium
          ## Annual Activity Report 2025

          **High-Voltage Transmission System Operator**
          **Belgium & Germany Operations**
          **Headquarters: Brussels, Belgium**

          ---

          ## Executive Summary

          Elia Transmission Belgium, part of the Elia Group, operates as one of Europe's leading transmission system operators (TSOs), managing electricity transmission infrastructure across Belgium and northern/eastern Germany through its 50Hertz subsidiary. Our network serves approximately 29 million end users, maintaining high-voltage infrastructure exceeding 8,900 km (ranging from 30 kV to 400 kV) with a system reliability rate of 99.98%.

          Financial results for H1 2025 show revenue of €2.12 billion (representing a 9.8% increase year-over-year) and net profit attributable to shareholders of €264.3 million (up 46.2%). Our regulated asset base has expanded to €18.2 billion, reflecting ongoing investments in critical grid infrastructure to facilitate Europe's energy transition.

          ---

          ## 1. Operational Performance

          ### 1.1 Grid Reliability and Management

          Elia has achieved strong operational performance across our service territories:

          - **Belgium**: 99.88% grid reliability in 2024
          - **Germany (50Hertz)**: 99.82% grid reliability in 2024
          - **System Balance**: 24/7 monitoring and real-time balancing of generation and consumption
          - **Frequency Management**: Maintaining 50 Hz grid frequency through sophisticated balancing mechanisms

          ### 1.2 Renewable Energy Integration

          2025 has marked significant achievements in renewable energy integration:

          - **Solar Generation**: 19% increase in solar generation capacity
          - **Nuclear Energy**: Accounts for 36% of Belgian generation mix
          - **Offshore Wind**: Operation of Modular Offshore Grid (MOG) platform serving 4 offshore wind farms with combined capacity of 1 GW
          - **MOG Performance**: Over 14.5 TWh of renewable electricity transported since 2019, with availability rates of 99.97% in 2020 and 99.99% thereafter

          ---

          ## 2. Strategic Infrastructure Projects

          ### 2.1 Princess Elisabeth Island

          **Project Specifications:**
          - Location: 45 km offshore from Belgian coast in the Princess Elisabeth Zone
          - Island Surface Area: 12 hectares (above sea level)
          - Wind Capacity: 3.5 GW offshore wind integration capability
          - Investment: €1.2 billion for Phase 1 (island infrastructure)
          - Timeline: Construction 2024-2028, operational target 2030
          - Households Served: Approximately 3.2 million

          **Financial Structure:**
          - European Investment Bank: €625 million green credit facility
          - European Recovery and Resilience Facility (RePowerEU): €100 million grant

          ### 2.2 Grid Modernization and Expansion

          **Investment Framework:**
          - 2024 Grid Investment: €4.6 billion deployed
          - 2025-2028 Investment Plan: €27.2 billion committed
          - Total 2024-2028 Programme: €31.8 billion

          ### 2.3 Capital Structure and Financing

          Elia Group secured €2.1 billion in equity financing during 2025, including an €825 million private placement. Green bond activities include a €800 million green bond issuance (January 2024) via the €6 billion EMTN programme.

          ---

          ## Key Performance Indicators Summary

          | Metric | 2024/2025 Performance |
          |--------|----------------------|
          | Grid Reliability (Belgium) | 99.88% |
          | Grid Reliability (Germany) | 99.82% |
          | H1 2025 Revenue | €2.12 billion (+9.8% YoY) |
          | H1 2025 Net Profit | €264.3 million (+46.2% YoY) |
          | Regulated Asset Base | €18.2 billion (+26.4%) |
          | Grid Infrastructure (Belgium) | 8,900+ km (30-400 kV) |
          | 2025-2028 Investment Plan | €27.2 billion |
          | End Users Served | 29 million (Belgium & Germany) |

          ---

          **Report Prepared:** January 2025
          **Prepared by:** Finance & Strategy Department
          **Organization:** Elia Transmission Belgium
          **Headquarters:** Brussels, Belgium

          *This report consolidates publicly available information regarding Elia's operations, financial results, and strategic initiatives as of January 2025.*

  id_workspace_view:
    kind: tool
    model_type: akgentic.tool.workspace.WorkspaceTool
    description: Read-only workspace access for the manager and architect
    payload:
      name: Workspace
      read_only: true

  id_knowledge_graph:
    kind: tool
    model_type: akgentic.tool.knowledge_graph.KnowledgeGraphTool
    description: Knowledge graph — full read/write access for the Librarian
    payload:
      name: Knowledge Graph

  id_knowledge_graph_ro:
    kind: tool
    model_type: akgentic.tool.knowledge_graph.KnowledgeGraphTool
    description: Knowledge graph — read-only access for the Detective
    payload:
      name: Knowledge Graph
      read_only: true

  #### ─── Tools (External ref, readonly) ───────────────────────────────── ####
  global.id_web_search:
    kind: tool
    model_type: akgentic.tool.search.SearchTool
    description: Web search + crawl + fetch over Tavily
    payload:
      name: Web Search
      web_search:
        max_results: 5
      web_crawl:
        timeout: 150.0
        max_depth: 3
        max_breadth: 5
        limit: 10
      web_fetch:
        timeout: 30.0

  #### ─── Models ───────────────────────────────────────────────────────── ####
  id_azure_gpt_41:
    kind: model
    model_type: akgentic.llm.ModelConfig
    description: GPT-4.1 via Azure OpenAI — shared model configuration
    payload:
      provider: azure
      model: gpt-4.1
