namespace: agent-team
user_id: anonymous
name: Agent Team V1
description: Manager coordinating Assistant, Expert and Support Human agents team
  !
properties:
  user_name: Geoff
shareable: false
public: false
entries:

  #### ─── Teams ────────────────────────────────────────────────────────── ####
  team:
    kind: team
    model_type: akgentic.team.TeamCard
    description: Manager coordinating Assistant, Expert and Support Human agents
    payload:
      welcome_message: |
        Welcome to the Agent team.
      entry_point:
        card:
          __ref__: human_proxy
      members:
      - card:
          __ref__: manager
        members:
        - card:
            __ref__: expert
        - card:
            __ref__: assistant
        - card:
            __ref__: human_support
      message_types:
      - __type__: akgentic.agent.messages.AgentMessage
      agent_profiles:
      - __ref__: expert
      - __ref__: assistant
      - __ref__: human_support

  #### ─── Agents ───────────────────────────────────────────────────────── ####
  assistant:
    kind: agent
    model_type: akgentic.core.AgentCard
    description: Helpful assistant providing support
    payload:
      description: Helpful assistant providing support
      agent_class: akgentic.agent.BaseAgent
      skills:
      - research
      - writing
      config:
        name: '@Assistant'
        role: Assistant
        prompt:
          __ref__: id_team_prompt
          params:
            role: assistant
            instructions: Provide clear and accurate information.
        model_cfg:
          __ref__: global.id_gpt_41
        tools:
        - __ref__: global.id_web_search
        - __ref__: global.id_planning
        - __ref__: global.id_workspace

  expert:
    kind: agent
    model_type: akgentic.core.AgentCard
    description: Helpful expert providing specialized knowledge
    payload:
      description: Helpful expert providing specialized knowledge
      agent_class: akgentic.agent.BaseAgent
      skills:
      - analysis
      - problem-solving
      config:
        name: '@Expert'
        role: Expert
        prompt:
          __ref__: id_team_prompt
          params:
            role: expert
            instructions: Provide deep specialized knowledge.
        model_cfg:
          __ref__: global.id_gpt_41
        tools:
        - __ref__: global.id_web_search
        - __ref__: global.id_planning
        - __ref__: global.id_workspace

  human_proxy:
    kind: agent
    model_type: akgentic.core.AgentCard
    description: Human user interface — primary entry point
    payload:
      description: Human user interface — primary entry point
      agent_class: akgentic.agent.HumanProxy
      skills: []
      config:
        name: '@Human'
        role: Human

  human_support:
    kind: agent
    model_type: akgentic.core.AgentCard
    description: Human support operator reachable by the manager
    payload:
      description: Human support operator reachable by the manager
      agent_class: akgentic.agent.HumanProxy
      skills: []
      config:
        name: '@Support'
        role: Human

  manager:
    kind: agent
    model_type: akgentic.core.AgentCard
    description: Helpful manager coordinating team work
    payload:
      description: Helpful manager coordinating team work
      agent_class: akgentic.agent.BaseAgent
      skills:
      - coordination
      - delegation
      config:
        name: '@Manager'
        role: Manager
        prompt:
          __ref__: id_team_prompt
          params:
            role: manager
            instructions: Coordinate the team effectively to achieve goals.
        model_cfg:
          __ref__: global.id_gpt_56
        run_usage_limits:
          __ref__: global.id_run_usage_limits
        id_agent_usage_limits:
          __ref__: global.id_agent_usage_limits
        tools:
        - __ref__: global.id_web_search
        - __ref__: global.id_planning
        - __ref__: global.id_workspace

  #### ─── Prompts ──────────────────────────────────────────────────────── ####
  id_team_prompt:
    kind: prompt
    model_type: akgentic.llm.PromptTemplate
    description: Default system prompt for team members
    payload:
      template: "You are a helpful {role}. \n{instructions}"

  #### ─── Tools (External ref, readonly) ───────────────────────────────── ####

  global.id_planning:
    kind: tool
    model_type: akgentic.tool.planning.PlanningTool
    description: Planning tool to manage team plans and tasks
    payload:
      name: Planning
      vector_store: false
      update_planning:
        instructions: |
          CRITICAL: Always keep the plan updated.
          Create tasks when your task involves other team members
          or is complex enough to require multiple steps.
          Update task status when you make progress.
          Record outputs when you complete work.
          Do not finish your turn if the plan is stale.

  global.id_web_search:
    kind: tool
    model_type: akgentic.tool.search.SearchTool
    description: Web search + crawl + fetch over Tavily
    payload:
      name: Web Search
      web_search:
        max_results: 5
      web_crawl:
        timeout: 150.0
        max_depth: 3
        max_breadth: 5
        limit: 10
      web_fetch:
        timeout: 30.0

  global.id_workspace:
    kind: tool
    model_type: akgentic.tool.workspace.WorkspaceTool
    description: Workspace tool for managing agent interactions and data
    payload:
      name: Workspace

  #### ─── Models (External ref, readonly) ──────────────────────────────── ####

  global.id_gpt_41:
    kind: model
    model_type: akgentic.llm.ModelConfig
    description: GPT-4.1 via OpenAI — shared model configuration
    payload:
      provider: openai
      model: gpt-4.1
      temperature: 0.3

  global.id_gpt_54:
    kind: model
    model_type: akgentic.llm.ModelConfig
    description: GPT-5.4 via OpenAI — shared model configuration
    payload:
      provider: openai
      model: gpt-5.4
