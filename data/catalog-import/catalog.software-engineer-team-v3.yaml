namespace: software-engineer-team-v3
user_id: anonymous
name: Software Engineering Team v3
description: A managing engineer who talks the work through with you, writes a backlog for the team, and
  dispatches each task with the workflow it needs. Roles are fixed; the process is not.
properties: &id001
  overview: |
    A software team run as a workflow rather than a chat. @Manager owns the METHOD - the
    stages, the work-item file, the gate between stages - and none of the technical content.
    Four specialists hold that: @Analyst (what is actually being asked for), @Architect (how
    it should be built), @Developer (building it), @Reviewer (whether it is right). @QA is
    available for hire when tests need to be written or proven rather than reviewed.

    The design borrows BMAD's central idea: a work-item file that carries everything the
    implementer needs, so the developer never has to go hunting for context, and every stage
    hands the next one a document rather than a conversation.
  principles: |
    Information asymmetry is the design. @Manager holds the stages and the gates; each
    specialist holds its discipline in full and the manager holds none of it. A coordinator
    that could answer alone will, because delegating buys it only latency.

    Stages are gated, in BMAD's order: analyse -> design -> plan -> implement -> review.
    A stage may not start before its predecessor's output is written into the work item.
    The manager enforces the gate; it does not do the work.

    Every specialist has a mandatory peer it MUST consult for a defined class of claim.
    Permission produces no peer traffic - only an obligation does.
  flow: |
    @Human -> @Manager -> specialists (parallel where the stage allows) -> @Manager -> @Human.
    Hub-and-spoke for reporting: specialists never address @Human. Delegation is the
    `recipient` field on a Request in StructuredOutput, not a tool call. Each hop is an
    independent actor turn with no call stack, so the manager gathers via the planning board:
    one task per dispatch, silent while any task is open, one report per round.

    Specialists also consult each other directly. Each has ONE named peer and a defined
    trigger; it sends that peer a `request` and the manager a `notification`, then exactly one
    `response` once the peer answers. Depth is capped at 1 - a specialist answering a peer
    never consults anyone else - so chains terminate.
  workflow_stages: |
    ANALYSE   @Analyst    - what is actually being asked, what is in and out of scope,
                            acceptance criteria, open questions. Gate: ACs written.
    DESIGN    @Architect  - components touched, the approach, the trade-off taken and what
                            was rejected, risks. Gate: approach and file-level impact stated.
    PLAN      @Manager    - turns the above into a work item with numbered tasks, each tied
                            to an AC. Gate: every AC has at least one task.
    IMPLEMENT @Developer  - implements task by task, keeps the File List current, runs the
                            tests. Gate: all tasks checked and tests passing.
    REVIEW    @Reviewer   - reviews against the ACs, cites file:line, gives a verdict of
                            APPROVE / CHANGES REQUESTED / REJECT. Gate: verdict recorded.
  tools: |
    WorkspaceTool - the codebase and the work items. @Manager read/write (it owns
      work-items/*.md and report.md). @Developer full read/write plus edit. @Analyst,
      @Architect and @Reviewer are READ-ONLY but keep glob and grep, because reading a
      codebase is most of their job.
    ExecTool - @Developer only. A software team that cannot run its tests is doing review by
      inspection. Sandboxed, allowlisted commands only.
    PlanningTool - @Manager only. The dispatch/gather ledger and the stage board;
      get_planning is on the SYSTEM_PROMPT channel, which is how it knows it is still waiting.
    KnowledgeGraphTool - read/write for @Manager, read-only for specialists. Holds work items,
      requirements, components, decisions and risks, with observations recording who
      established each and what a peer confirmed or contested.
    SearchTool - @Analyst and @Architect only; the others work from the codebase. web_fetch
      and web_crawl are DISABLED - one fetch is ~24k tokens and stays in context all turn.
    TeamTool - explicit per-tier cards, never the auto-injected default. Specialists get the
      roster only; hire/fire and team_activity are manager-only, because a specialist once
      polled team_activity 23 times in one turn instead of answering.
  graph: |
    A RECORD, not a view. Work at 20-30 nodes. Nodes carry 2-3 sentences of substance and
    observations using a fixed vocabulary - "Reported by @X", "Confirmed by @X", "Contested
    by @X", "Revised", "Evidence", "Open" - so a peer consultation that changed a decision is
    preserved. Prune only past ~30, and never before copying the node into the work item.
  limits: |
    Both tiers on every agent; neither is set by default and the framework's only stock brake
    is pydantic-ai's run_request_limit=50, which is a loop guard rather than a budget.
      manager     run 15 req / 12 tool calls / 120k tokens / 6k output ; life 60 runs / 600k
      specialist  run 20 req / 20 tool calls / 120k tokens / 4k output ; life 40 runs / 300k
    Sized at roughly 3x measured clean runs on comparable teams. The per-run
    total_tokens_limit is the only limit that actually bounds cost - request and tool-call
    counts do not, because each request carries the whole growing context.
    A run-tier breach is not fatal: the framework asks the agent for one tool-free
    conclusion so the requester still gets what was gathered. An agent-tier (lifetime) breach
    is terminal.
  lineage: |
    Successor to `software-engineer-team`. Fixes that version's agent_profiles defect, which
    listed every instantiated member and so let the model hire duplicates by role name.
shareable: false
public: true
entries:
  team:
    kind: team
    model_type: akgentic.team.TeamCard
    description: Managing engineer running a gated analyse/design/plan/implement/review flow
    payload:
      welcome_message: |
        ## Software Engineering Team — **v2**

        A managing engineer who owns the **workflow**, and four specialists who own the work.

        | Agent | Owns | Answers |
        |---|---|---|
        | **@Analyst** | analysis | what is actually being asked, and what "done" means |
        | **@Architect** | design | how it should be built, and what was rejected |
        | **@Developer** | implementation | the code, the tests, the file list |
        | **@Reviewer** | review | whether it is right, cited at `file:line` |

        **@Manager** holds the stages and the gates, not the answers.

        **How it works**

        - **Stages are gated**, in order: *analyse → design → plan → implement → review*. A stage cannot start until its predecessor's output is written into the work item.
        - **The work item carries the context.** `work-items/<id>.md` holds the acceptance criteria, the design decision, the numbered tasks, the file list and the review verdict — so the developer never hunts for context and every handoff is a document.
        - **Specialists consult each other directly.** Each must check with a named peer before certain claims: an analyst cannot judge feasibility, an architect cannot assume the codebase, a developer cannot silently change a design, a reviewer cannot reject against a requirement nobody wrote.
        - **It asks before it starts.** Expect a couple of short questions: what you want changed, in which codebase, and how far you want it taken.

        **@QA** is available but not hired — ask for it when you want tests written and proven rather than reviewed.

        Tell me what you want built or changed.
      entry_point:
        card:
          __ref__: human_proxy
      members:
      - card:
          __ref__: manager
        members:
        - card:
            __ref__: analyst
        - card:
            __ref__: architect
        - card:
            __ref__: developer
        - card:
            __ref__: reviewer
      message_types:
      - __type__: akgentic.agent.messages.AgentMessage
      agent_profiles:
      - __ref__: analyst
      - __ref__: architect
      - __ref__: developer
      - __ref__: reviewer
      - __ref__: qa_engineer
