namespace: insurance-call-center
user_id: anonymous
name: Insurance Call Center
description: Call Center Manager coordinating identity verification, contract lookup
  and pension/life/disability claims specialists
properties:
  user_name: Geoff
shareable: false
public: false
entries:

  #### ─── Teams ────────────────────────────────────────────────────────── ####
  team:
    kind: team
    model_type: akgentic.team.TeamCard
    description: Call Center Manager coordinating the insurance support team
    payload:
      welcome_message: |
        Welcome to the Insurance Call Center! I'm here to help you with your pension, life insurance, and disability coverage inquiries.
        To ensure I can assist you properly and maintain security, I'll need to verify your identity first.

        Please provide:
        - Your full name (as registered with our company)
        - Your date of birth
        - Your National Registry Number or Policy ID

        How may I assist you today?
      entry_point:
        card:
          __ref__: human_proxy
      members:
      - card:
          __ref__: manager
        members:
        - card:
            __ref__: client_identification_specialist
        - card:
            __ref__: contract_identification_specialist
        - card:
            __ref__: pension_claims_specialist
        - card:
            __ref__: life_insurance_claims_specialist
        - card:
            __ref__: disability_claims_specialist
      message_types:
      - __type__: akgentic.agent.messages.AgentMessage
      agent_profiles:
      - __ref__: client_identification_specialist
      - __ref__: contract_identification_specialist
      - __ref__: pension_claims_specialist
      - __ref__: life_insurance_claims_specialist
      - __ref__: disability_claims_specialist

