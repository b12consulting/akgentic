      name: Knowledge Graph
      read_only: true

  id_vector_store:
    kind: tool
    model_type: akgentic.tool.vector_store.VectorStoreTool
    description: Vector store for retrieval-augmented generation (RAG)
    payload:
      name: Vector Store

  #### ─── Tools (External ref, readonly) ───────────────────────────────── ####
  global.id_web_search:
    kind: tool
    model_type: akgentic.tool.search.SearchTool
    description: Web search + crawl + fetch over Tavily
    payload:
      name: Web Search
      web_search:
        max_results: 5
      web_crawl:
        timeout: 150.0
        max_depth: 3
        max_breadth: 5
        limit: 10
      web_fetch:
        timeout: 30.0

  #### ─── Models (External ref, readonly) ──────────────────────────────── ####
  global.id_gpt_41:
    kind: model
    model_type: akgentic.llm.ModelConfig
    description: GPT-4.1 via OpenAI — shared model configuration
    payload:
      provider: openai
      model: gpt-4.1
