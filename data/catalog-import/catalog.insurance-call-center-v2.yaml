    model_type: akgentic.llm.AgentUsageLimits
    description: Lifetime budget shared by every specialist across one call-center
      session.
    payload:
      agent_request_limit: 60
      total_tokens_limit: 250000

  id_run_limits_manager:
    kind: model
    model_type: akgentic.llm.RunUsageLimits
    description: Per-run brake for the manager. TeamTool is fully disabled, but the
      busiest turn (a claims specialist's response) can do update_graph + get_graph
      + workspace_write in one run before replying — sized at roughly 2x that, not
      measured yet.
    payload:
      run_request_limit: 15
      tool_calls_limit: 6
      total_tokens_limit: 100000
      output_tokens_limit: 3000

  id_run_limits_specialist:
    kind: model
    model_type: akgentic.llm.RunUsageLimits
    description: Per-run brake shared by every specialist. TeamTool is fully disabled
      for all five; ClientIdentificationSpecialist and ContractIdentificationSpecialist
      additionally make one read-only workspace_read call each. Each specialist sends
      exactly one `response` per request.
    payload:
      run_request_limit: 8
      tool_calls_limit: 2
      total_tokens_limit: 40000
      output_tokens_limit: 1200

  #### ─── Models (External ref, readonly) ──────────────────────────────── ####

  global.id_gpt_54:
    kind: model
    model_type: akgentic.llm.ModelConfig
    description: GPT-5.4 via OpenAI — shared model configuration
    payload:
      provider: openai
      model: gpt-5.4
