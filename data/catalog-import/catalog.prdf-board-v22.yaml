  framework_core:
    kind: model
    model_type: akgentic.catalog.NativeValue
    description: PrDF — condensed, all four dimensions
    payload:
      value: |
        ## THE PRODUCT DIGITIZATION FRAMEWORK

        Muylle and Standaert (Vlerick) with Basu (SMU Cox) — Accenture Belux / Vlerick Digital 20/20 Chair, 2018. Applies to any product or service, tied to no particular technology.

        Four dimensions. **Apply all four from your own vantage** — that is what makes you useful to this board.

        **1. Composition** — the product is a *system*, of *sub-systems*, of *components*. Digitization can happen at any level, converting an analog (tangible, electromechanical) element into a digital one. Wherever a person or physical system interacts with a digital artefact, a **digital-to-physical interface** is required.

        *Example.* A suitcase → Lock, Handle, Casing, Wheels; the Casing → Outside Surface, Inside Surface, ID Pouch. Digitizing the ID Pouch — a paper sleeve — gives an electronic luggage tag, and turns out to be the most valuable change in the product.

        **2. Connectivity** — three nested scopes: the **local user** (direct access, via the digital-to-physical interface), the **local environment** (users, products, systems nearby), and the **cloud** (remote user, producer, anything anywhere). A digitized element usually needs **two** interfaces — one outward, one into the rest of the product.

        **3. Capabilities** — a ladder, each rung resting on the one below:
        - **Sense** (sensors) → **Inform** the user or environment
        - **Process** (logic) → **Change state**, via actuators
        - **Learn** (machine learning) → **Improve** performance

        *Example.* The lock senses and reports its state; it is locked remotely; it learns which users to admit. Several bags on one journey learn they belong together and sync their tags — a *learn* capability emerging across units.

        **4. User experience** — how anyone who interacts with the product experiences it: owner, seller, producer, servicer, regulator, bystander. Digitization can both **impact** an experience and **expand** it, before and after the moment of use.

        *Example.* The electronic tag removes the paper tag at check-in — and also pays off for the manufacturer (differentiation), the airline (no manual handling) and border control (pre-filled forms). **The strongest case usually pays off for several stakeholders at once.**

        The first three dimensions are **orthogonal**: for each element, several connectivity scopes; at each scope, several capability levels.

        Use the *shape* of the suitcase example, never its content, unless the product is a suitcase.
  graph_schemas:
    kind: model
    model_type: akgentic.catalog.NativeValue
    description: Knowledge graph schema, four dimensions, curated to the topic in play
    payload:
      value: |
        === START SCHEMA =====================================================

        This graph is a **view of the current topic**, not an archive. Keep it under
        roughly 25 nodes. Prune with delete_entities when the focus moves — deleting an
        entity cascades to its relations.

        ## Core Entities

        (:Product) - Singleton, the product being analysed.
        - name: STRING (REQUIRED, unique)
        - description: STRING (REQUIRED)

        (:UseContext) - A situation in which the product is used. Record only the
          context(s) actually under discussion.
        - name: STRING (REQUIRED)
        - description: STRING (REQUIRED)
        - Observations: "When: <trigger>", "Outcome: <what the user gets>"

        (:Stakeholder) - Record only stakeholders actually consulted or argued about.
        - name: STRING (REQUIRED)
        - description: STRING (REQUIRED)
        - Observations: "Type_Owner"|"Type_Servicer"|"Type_Producer"|"Type_Commercial"|"Type_Regulator"|"Type_Other"

        (:SubSystem) - Record only sub-systems actually being examined.
        - name: STRING (REQUIRED)
        - description: STRING (REQUIRED)
        - Observations: "State_Analog"|"State_Digital"

        (:Component) - Record only components actually being examined.
        - name: STRING (REQUIRED)
        - description: STRING (REQUIRED)
        - Observations: "State_Analog"|"State_Digital"

        (:Capability) - Record only capabilities the board proposed or split over.
        - name: STRING (REQUIRED)
        - description: STRING (REQUIRED)
        - Observations: "Function_Sense"|"Function_Process"|"Function_Learn", and
          "Contested" when stakeholders disagreed about it.

        (:Local_User), (:Local_Environment), (:Cloud) - Connectivity scopes. Create one
          only when a capability actually reaches it.
        - name: STRING (REQUIRED)
        - description: STRING (REQUIRED)

        ## Relationships

        (:Product)-[:USED_IN]->(:UseContext)
        (:UseContext)-[:INVOLVES]->(:Stakeholder)
        (:Product)-[:HAS_SUB_SYSTEM]->(:SubSystem)
        (:SubSystem)-[:HAS_SUB_SYSTEM]->(:SubSystem)
        (:SubSystem)-[:HAS_COMPONENT]->(:Component)
        (:Component)-[:SUPPORTS]->(:Capability)
        (:SubSystem)-[:SUPPORTS]->(:Capability)
        (:Capability)-[:INTERACTS_WITH]->(:Local_User|:Local_Environment|:Cloud)
        (:Stakeholder)-[:EXPERIENCES]->(:Capability)

        === END SCHEMA ========================================================
  id_knowledge_graph:
    kind: tool
    model_type: akgentic.tool.knowledge_graph.KnowledgeGraphTool
    description: Knowledge graph — read/write, curated by the Product Manager
    payload:
      update_graph:
        instructions: |
          The user is looking at this graph while you work. It is a VIEW OF THE CURRENT
          TOPIC, not an archive. A graph with sixty nodes and crossing labels is worth less
          than one with fifteen, because nothing on it can be read.

          Before adding: ask whether this node is part of what the user is actually
          exploring right now. If not, do not create it.

          BEFORE you delete anything, copy those nodes' descriptions and observations into
          analysis-log.md verbatim. Pruning is only safe because that file exists.

          Keep the graph under roughly 25 nodes. When it grows past that, or when the focus
          moves, use `delete_entities` (a list of entity names; deleting an entity cascades
          to its relations) to remove what is no longer in play — contexts the user set
          aside, stakeholders no longer consulted, sub-systems nobody is examining.

          Record what the board converged on or split over, not every option a stakeholder
          listed. Mark a contested capability with the "Contested" observation.

          Pruning is not data loss — **provided you wrote the node into `analysis-log.md` first** (section 9). That file, not the graph, is the record.
  id_knowledge_graph_ro:
    kind: tool
    model_type: akgentic.tool.knowledge_graph.KnowledgeGraphTool
    description: Knowledge graph — read-only for the stakeholders
    payload:
      read_only: true
      get_graph:
        instructions: |
          This is the current focus of the board — deliberately small, and pruned as the
          topic moves. Reuse the names recorded here rather than inventing new ones.

          It is not a complete record, so its absence of something is not evidence. And you
          are not obliged to agree with it: where another stakeholder recorded something you
          see differently, say so in your reply. Disagreement is what this board is for.
  id_planning:
    kind: tool
    model_type: akgentic.tool.planning.PlanningTool
    description: Task board — the chair's dispatch and gather ledger
    payload:
      update_planning:
        instructions: |
          This board is how you know whether you are still waiting.

          Create ONE task per stakeholder request the moment you dispatch it, owned by that
          stakeholder. Mark it done when they reply. A stakeholder who says they are waiting
          on a peer is NOT done — leave the task open until their follow-up arrives.

          Before sending anything to @Human, read the board. If any task is open, you are
          waiting: send nothing and stop.
  id_search_owner:
    kind: tool
    model_type: akgentic.tool.search.SearchTool
    description: Web search — lived experience and complaints
    payload:
      web_fetch: false
      web_crawl: false
      web_search:
        max_results: 3
        instructions: |
          Search only when you genuinely do not know how people live with this product.
          Look for one- and two-star reviews, forum threads and running-cost complaints —
          the moments where the product costs someone effort, time or trust. Not the
          manufacturer's feature list. One search is usually enough.
  id_search_servicer:
    kind: tool
    model_type: akgentic.tool.search.SearchTool
    description: Web search — failure modes and service economics
    payload:
      web_fetch: false
      web_crawl: false
      web_search:
        max_results: 3
        instructions: |
          Search only when you genuinely do not know this product's failure modes. Look for
          repair guides, teardowns, service intervals, spare-part prices and end-of-life
          guidance. A repair manual beats any product page. One search is usually enough.
  id_search_producer:
    kind: tool
    model_type: akgentic.tool.search.SearchTool
    description: Web search — BOM cost and manufacturing consequences
    payload:
      web_fetch: false
      web_crawl: false
      web_search:
        max_results: 3
        instructions: |
          Search only when you genuinely do not know the component economics. Look for
          sensor and module unit prices at volume, BOM teardowns of comparable connected
          products, radio certification requirements and power budgets. Ground your numbers;
          label anything you could not ground as an estimate. One search is usually enough.
  id_search_commercial:
    kind: tool
    model_type: akgentic.tool.search.SearchTool
    description: Web search — competitors, pricing and business models
    payload:
      web_fetch: false
      web_crawl: false
      web_search:
        max_results: 3
        instructions: |
          Search only when you genuinely do not know what the market already sells. Look for
          competing connected products, their price premium over the unconnected version,
          and any subscription or service-contract model. If a competitor already ships this
          feature, that is the most important fact you can bring back. One search is usually
          enough.
  id_search_regulator:
    kind: tool
    model_type: akgentic.tool.search.SearchTool
    description: Web search — standards, safety and data protection
    payload:
      web_fetch: false
      web_crawl: false
      web_search:
        max_results: 3
        instructions: |
          Search only when you genuinely do not know this category's rules. Look for
          applicable safety standards, recall notices, cybersecurity and radio requirements,
          data-protection decisions on connected devices, and repairability obligations. Do
          not cite an instrument you could not ground — describe the obligation instead.
          One search is usually enough.
  id_search_challenger:
    kind: tool
    model_type: akgentic.tool.search.SearchTool
    description: Web search — prior art and failed attempts
    payload:
      web_fetch: false
      web_crawl: false
      web_search:
        max_results: 3
        instructions: |
          Search for evidence that would REFUTE the opportunity: products already on the
          market that do this, companies that tried and withdrew, costs that make it
          uneconomic, regulations that forbid it. An existing product is the strongest
          possible objection — look for it first.
  id_run_limits_chair:
    kind: model
    model_type: akgentic.llm.RunUsageLimits
    description: 'Per-run brake for the coordinator, sized from measurement. Worst clean run observed:
      36,889 tokens / 2,815 output / 4 requests / 3 tool calls. These are roughly 3x that — a brake, not
      a formality.'
    payload:
      run_request_limit: 15
      tool_calls_limit: 12
      total_tokens_limit: 120000
      output_tokens_limit: 6000
  id_agent_limits_chair:
    kind: model
    model_type: akgentic.llm.AgentUsageLimits
    description: 'Lifetime budget for the coordinator: 60 runs, 600k tokens. A full 4-turn session used
      ~100k over 8 runs, so this covers a long demo with headroom while still bounding a catastrophe.'
    payload:
      agent_request_limit: 60
      total_tokens_limit: 600000
  id_run_limits_member:
    kind: model
    model_type: akgentic.llm.RunUsageLimits
    description: 'Per-run brake for a member, sized from measurement. Worst clean run observed: 46,774
      tokens / 704 output / 7 requests / 8 tool calls. These are roughly 2.5-3x that. output_tokens_limit
      is a runaway guard, NOT a word-count enforcer — exceeding it errors the turn and deadlocks the gather,
      so it is set well clear of a long legitimate answer.'
    payload:
      run_request_limit: 20
      tool_calls_limit: 20
      total_tokens_limit: 120000
      output_tokens_limit: 3000
  id_agent_limits_member:
    kind: model
    model_type: akgentic.llm.AgentUsageLimits
    description: 'Lifetime budget for a member: 40 runs, 300k tokens. Bounds the whole session even when
      every individual run stays under its own cap — the failure mode a per-run limit cannot see.'
    payload:
      agent_request_limit: 40
      total_tokens_limit: 300000
  id_team_member:
    kind: tool
    model_type: akgentic.tool.team.TeamTool
    description: Team awareness for a member — roster only. No hiring, no firing, no activity polling.
    payload:
      hire_team_members: false
      fire_team_members: false
      get_team_activity: false
      get_role_profiles: false
      get_team_roster: true
  id_team_chair:
    kind: tool
    model_type: akgentic.tool.team.TeamTool
    description: Team management for the coordinator — hire/fire, roster, profiles and the activity report.
    payload: {}
  id_workspace_chair:
    kind: tool
    model_type: akgentic.tool.workspace.WorkspaceTool
    description: The coordinator's working files — an append-only analysis log and the report. Deliberately
      narrow, with no delete, no patch and no search.
    payload:
      workspace_delete: false
      workspace_glob: false
      workspace_grep: false
      workspace_view: false
      workspace_patch: false
      workspace_multi_edit: false
      workspace_mkdir: false
      workspace_write:
        instructions: |
          You maintain two files, and they are the only durable record of this session.

          analysis-log.md is APPEND-ONLY. Never rewrite an earlier entry. Add a block each
          turn covering who you asked, what came back, what was settled or contested, and
          what you told the user.

          IMPORTANT. Before you call delete_entities on the knowledge graph, write the full
          content of every node you are about to remove into analysis-log.md - its
          description and all of its observations, verbatim. The graph is curated and loses
          things by design; this file is what makes that safe.

          report.md is the deliverable. Rewrite it whenever the user asks for a report, or
          when the analysis reaches a natural conclusion. Build it from analysis-log.md
          rather than from memory.
      workspace_read:
        instructions: |
          Read analysis-log.md before writing a report, and whenever you need something the
          knowledge graph no longer holds. This file remembers what the graph pruned.
