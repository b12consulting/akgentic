[project]
name = "akgentic-agent"
version = "1.2.1"
description = "Collaborative agent patterns for the Akgentic framework"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "gpiroux", email = "geoffroy.piroux@weareyuma.com" }
]
keywords = ["agents", "ai", "team", "collaboration", "pydantic-ai"]
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

# akgentic-* bounds: floor = version on this maintenance line, ceiling = next
# minor. The ceiling is what stops a 1.3.x install from resolving to a 2.x-line
# subpackage release already on PyPI.
dependencies = [
    "pydantic>=2.0.0",
    "akgentic-core>=1.3.3,<1.4",
    "akgentic-llm>=1.2.0,<1.3",
    "akgentic-tool>=1.2.2,<1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.8.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/akgentic"]

[tool.uv.sources]
akgentic-core = { workspace = true }
akgentic-llm = { workspace = true }

# Tool configurations inherit from root workspace pyproject.toml
# Only override when package-specific behavior is needed

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = []
