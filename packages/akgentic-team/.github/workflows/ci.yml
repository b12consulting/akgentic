name: CI

on:
  push:
  pull_request:
    # version-1.3.x only, matching akgentic-infra's 1.3.x workflow. For
    # pull_request GitHub loads the workflow from the BASE branch, so a PR
    # targeting master runs master's ci.yml, never this file — listing master
    # here would be dead config implying a trigger that cannot fire.
    branches: [version-1.3.x]
  workflow_dispatch:

env:
  NO_COLOR: "1"

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: akgentic
          POSTGRES_PASSWORD: akgentic
          POSTGRES_DB: akgentic_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U akgentic"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      POSTGRES_SERVER: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: akgentic
      POSTGRES_PASSWORD: akgentic
      POSTGRES_DB: akgentic_test
      DB_CONN_STRING_PERSISTENCE: postgresql://akgentic:akgentic@localhost:5432/akgentic_test
    steps:
      # Self-contained checkout of this repo only. The previous 1.3.x workflow
      # checked out b12consulting/akgentic-quick-start at a pinned ref and then
      # cd'd into packages/akgentic-team to override it. That ref carries only
      # the three enterprise-tier submodules (infra-enterprise, infra-department,
      # infra-auth) — packages/akgentic-team does not exist there — so the
      # override step died with "No such file or directory" before a single test
      # ran. This model has no cross-repo dependency to go stale.
      - name: Checkout akgentic-team
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Create virtual environment
        run: uv venv

      # akgentic-core resolves from PyPI under the bounds in pyproject.toml.
      # All extras are listed so mypy can analyze their imports.
      - name: Install dependencies
        run: uv pip install -e ".[dev,mongo,postgres,cli]"

      # --no-sync: run in the venv built above without re-resolving from a
      # lockfile (there is no project lockfile in this install model).
      - name: Type checking
        run: uv run --no-sync mypy src/

      - name: Linting
        run: uv run --no-sync ruff check src/

      # pyproject's addopts already carries -m 'not integration', so the
      # LLM/API-key suite stays deselected without a flag here.
      - name: Run tests with coverage
        run: >
          uv run --no-sync pytest tests/
          --cov=akgentic.team
          --cov-report=term-missing
          --cov-report=json:coverage.json
          --cov-fail-under=80

      # Deliberately master-only: the badge gist reflects the mainline, and a
      # 1.3.x push must not overwrite it. This step is inert on this branch.
      - name: Update coverage badge
        if: github.ref_name == 'master' && github.event_name == 'push'
        run: |
          COVERAGE=$(python -c "import json; print(round(float(json.load(open('coverage.json'))['totals']['percent_covered_display'])))")
          if [ "$COVERAGE" -ge 90 ]; then COLOR="brightgreen"
          elif [ "$COVERAGE" -ge 80 ]; then COLOR="green"
          elif [ "$COVERAGE" -ge 70 ]; then COLOR="yellow"
          else COLOR="red"; fi
          echo "{\"schemaVersion\":1,\"label\":\"coverage\",\"message\":\"${COVERAGE}%\",\"color\":\"${COLOR}\"}" > badge.json
          gh gist edit 708bb547b8679308d083be7beaf4448a -f coverage.json badge.json
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
