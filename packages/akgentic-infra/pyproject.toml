[project]
name = "akgentic-infra"
version = "1.3.4"
description = "Infrastructure backend: protocol abstractions and community-tier implementations for akgentic"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "B12 Consulting", email = "info@b12consulting.com" }
]
keywords = ["agents", "ai", "akgentic", "infrastructure"]
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

# akgentic-* bounds: floor = version on this maintenance line, ceiling = next
# minor. The ceiling is what stops a 1.3.x install from resolving to a 2.x-line
# subpackage release already on PyPI.
dependencies = [
    "akgentic-core>=1.3.3,<1.4",
    "akgentic-team>=1.3.5,<1.4",
    "akgentic-catalog>=1.2.0,<1.3",
    "akgentic-agent>=1.2.1,<1.3",
    "akgentic-llm>=1.2.0,<1.3",
    "akgentic-tool>=1.2.2,<1.3",
    # Standalone CI has no lockfile, so these bounds are the resolution guard.
    # fastapi/starlette: Starlette 1.3 wraps mounted routers lazily, breaking
    # the app.routes introspection the tests rely on. pydantic-ai: not imported
    # here, but akgentic-llm 1.3.x allows >=0.1.0, and an unbounded resolve
    # prefers mcp 2.x and drags pydantic-ai down to 0.2.4, which imports the
    # since-removed opentelemetry._events.
    "fastapi>=0.100.0,<0.137",
    "starlette>=0.46.0,<1.1",
    "pydantic-ai>=1.107.0,<2",
    "pydantic-settings>=2.0.0",
    "logfire>=0.1.0",
    # Not typer[all]: the `all` extra was removed upstream, so it resolves with a
    # "does not provide the extra" warning on every install. Modern typer bundles
    # rich + shellingham directly, so the plain requirement is equivalent.
    "typer>=0.9.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "websockets>=12.0",
    "wsproto>=1.2.0",
    "rich>=13.0.0",
    "textual>=1.0.0",
]

[project.scripts]
ak-infra = "akgentic.infra.cli.main:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.8.0",
    "ruff>=0.1.0",
    "python-dotenv>=1.0.0",
    # Reached infra transitively via akgentic-catalog[dev] under the workspace's
    # `uv sync --all-extras`. Standalone CI installs only akgentic-infra[dev],
    # so mypy needs the yaml stubs declared here.
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["src/akgentic"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "ANN", "ASYNC", "C901", "PLR0912", "PLR0915"]
ignore = ["ANN401", "N802"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-branches = 12
max-statements = 50

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: Full server flow tests requiring real LLM and API keys",
    "llm: Tests requiring LLM API keys (auto-skipped when OPENAI_API_KEY is absent)",
    "smoke: End-to-end smoke tests using TestModel (no API key required)",
    "e2e: Real end-to-end tests requiring a running server and OPENAI_API_KEY",
]
addopts = "-m 'not integration' --cov=akgentic.infra --cov-branch"
filterwarnings = ["ignore:No logs or spans:UserWarning"]

[tool.coverage.report]
fail_under = 90
