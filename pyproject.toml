[project]
name = "akgentic-team"
version = "1.3.6"
description = "Team lifecycle management — create, resume, stop, delete teams with event-sourced persistence"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "gpiroux", email = "geoffroy.piroux@weareyuma.com" }
]
keywords = ["agents", "ai", "akgentic", "teams", "lifecycle"]
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

# akgentic-* bounds: floor = version on this maintenance line, ceiling = next
# minor. The ceiling is what stops a 1.3.x install from resolving to a 2.x-line
# subpackage release already on PyPI.
dependencies = [
    "pydantic>=2.0.0",
    # YamlEventStore and the CLI import `yaml` directly. Undeclared until now:
    # it resolved only because a sibling package pulled PyYAML into the shared
    # workspace environment, so a standalone install raised ImportError at
    # first use. Standalone CI is what surfaced it.
    "pyyaml>=6.0",
    "akgentic-core>=1.3.3,<1.4",
]

[project.optional-dependencies]
mongo = ["pymongo>=4.0.0"]
postgres = ["nagra>=0.5", "psycopg[binary]>=3.1"]
cli = ["typer>=0.9.0", "rich>=13.0.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.8.0",
    "ruff>=0.1.0",
    "mongomock>=4.0.0",
    "python-dotenv>=1.0.0",
    "nagra>=0.5",
    "psycopg[binary]>=3.1",
    "testcontainers[postgres]>=4.0.0",
    "types-PyYAML>=6.0",
]

[project.scripts]
ak-team = "akgentic.team.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Note: akgentic-* dependencies have NO [tool.uv.sources] entry here.
# - Inside the akgentic-quick-start workspace, the workspace root's
#   [tool.uv.sources] resolves them as editable workspace members.
# - In standalone CI, they resolve from PyPI under the bounds declared above.
# A `akgentic-core = { workspace = true }` entry here is fatal standalone:
# uv rejects a workspace source whose member does not exist.

[tool.hatch.build.targets.wheel]
packages = ["src/akgentic"]

# Explicitly ship non-Python assets needed at runtime (e.g., Nagra schema TOML
# for the Postgres backend). Without this, hatchling's default heuristics may
# skip files like *.toml under src/.
[tool.hatch.build.targets.wheel.force-include]
"src/akgentic/team/repositories/postgres/schema.toml" = "akgentic/team/repositories/postgres/schema.toml"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
markers = ["integration: Full lifecycle tests requiring real LLM and API keys"]
# --ignore: test_llm_lifecycle.py imports akgentic.agent at module scope, which
# is not a dependency of akgentic-team. Collection therefore fails with
# ModuleNotFoundError before the 'not integration' marker filter can deselect
# it — a marker filters at run time, it does not prevent import. This went
# unnoticed while CI installed the whole akgentic-quick-start workspace, where
# akgentic-agent is present; standalone CI surfaced it.
# DELIBERATE DIVERGENCE FROM master, which ignores all of tests/integration.
# Only test_llm_lifecycle.py imports akgentic.agent; the other four modules in
# that directory import akgentic.core only and contribute 16 passing tests
# (factory, lifecycle, persistence, process_human_input). Ignoring the whole
# directory would drop them silently.
addopts = "-m 'not integration' --ignore=tests/integration/test_llm_lifecycle.py"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "ANN", "ASYNC", "C901", "PLR0912", "PLR0915"]
ignore = ["ANN401", "N802"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-branches = 12
max-statements = 50
