[project]
name = "akgentic-llm"
version = "1.5.1"
description = "LLM integration layer for Akgentic agent systems"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "gpiroux", email = "geoffroy.piroux@weareyuma.com" }
]
keywords = ["llm", "agents", "ai", "pydantic-ai", "react"]

dependencies = [
    "pydantic-ai>=1.107.0,<2",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "tenacity>=8.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Token-free load-testing mock (akgentic.llm.loadtest). Parses scenario YAML.
loadtest = [
    "pyyaml>=6.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.8.0",
    "ruff>=0.1.0",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/akgentic"]
artifacts = ["src/akgentic/llm/pricing.yaml"]

# Tool configurations inherit from root workspace pyproject.toml
# Only override when package-specific behavior is needed

# Standalone-package CI does not check out the workspace, so the root's pytest
# config is not inherited; asyncio_mode='auto' must be set here or bare async
# tests fail collection (pytest-asyncio defaults to 'strict').
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = []
