# This file IS the published `akgentic-framework` distribution: a metadata-only
# wheel that contains no code, only a coherent set of pinned requirements.
# scripts/build_umbrella.py builds it straight from here — there is no generated
# copy, so what you review is what ships.
#
# It is also the uv workspace root when the source-mode blocks near the bottom
# are uncommented, which is why the pins matter in two directions: they are the
# release set consumers install, and the versions the submodules must be at.
#
# `version` is the release-set counter and is bumped BY HAND. The pins below are
# regenerated from the submodules by scripts/sync_versions.py — do not hand-edit
# them, or the umbrella will claim a set the packages do not agree with.
[project]
name = "akgentic-framework"
version = "2.8.0"
description = "Meta-distribution pinning a coherent akgentic release set."
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [
    { name = "gpiroux", email = "geoffroy.piroux@weareyuma.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

# The base install is the actor framework alone, so `pip install
# akgentic-framework` stays a usable minimal floor instead of dragging fastapi,
# textual and pydantic-ai into every consumer. Everything else is an extra.
dependencies = [
    "akgentic-core==1.5.0",
]

# Every extra pins its WHOLE akgentic closure, not just the package it names.
# Pinning only the named package would leave its akgentic dependencies to
# resolve by their own bounds, so [agent] could pull an akgentic-llm that was
# never tested against this release set — the one thing this distribution
# exists to prevent.
[project.optional-dependencies]
core = ["akgentic-core==1.5.0"]
llm = ["akgentic-llm==1.6.0"]
tool = [
    "akgentic-core==1.5.0",
    "akgentic-tool==1.6.0",
]
agent = [
    "akgentic-core==1.5.0",
    "akgentic-llm==1.6.0",
    "akgentic-tool==1.6.0",
    "akgentic-agent==1.6.0",
]
team = [
    "akgentic-core==1.5.0",
    "akgentic-team==1.5.0",
]
catalog = [
    "akgentic-core==1.5.0",
    "akgentic-tool==1.6.0",
    "akgentic-catalog==2.2.0",
    "akgentic-team==1.5.0",
]
infra = [
    "akgentic-core==1.5.0",
    "akgentic-llm==1.6.0",
    "akgentic-tool==1.6.0",
    "akgentic-agent==1.6.0",
    "akgentic-catalog==2.2.0",
    "akgentic-team==1.5.0",
    "akgentic-infra==1.8.0",
]
# Every subpackage, no optional extras (lean install).
all = [
    "akgentic-core==1.5.0",
    "akgentic-llm==1.6.0",
    "akgentic-tool==1.6.0",
    "akgentic-agent==1.6.0",
    "akgentic-catalog==2.2.0",
    "akgentic-team==1.5.0",
    "akgentic-infra==1.8.0",
]
# Every subpackage plus its own optional extras. `postgres` is deliberately
# absent: it is mutually exclusive with `mongo`, which this pulls in.
all-extras = [
    "akgentic-core==1.5.0",
    "akgentic-llm==1.6.0",
    "akgentic-tool[docs,vector-search,vision,weaviate]==1.6.0",
    "akgentic-agent==1.6.0",
    "akgentic-catalog[api,cli,mongo]==2.2.0",
    "akgentic-team[cli,mongo]==1.5.0",
    "akgentic-infra==1.8.0",
]
# The backend all-extras cannot carry; compose it as [all,postgres].
postgres = [
    "akgentic-core==1.5.0",
    "akgentic-tool==1.6.0",
    "akgentic-catalog[postgres]==2.2.0",
    "akgentic-team[postgres]==1.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Metadata-only distribution: there is no module to package, so skip hatchling's
# file selection entirely. This is what makes the wheel a pure set of
# requirements, and what keeps src/ out of it.
bypass-selection = true

[tool.hatch.build.targets.sdist]
# Same reason, but sdist has no bypass-selection: name the files explicitly, or
# hatchling errors out looking for a package to include.
only-include = ["README.md", "LICENSE"]

# --8<-- development-only below this line; stripped from the published distribution
#
# scripts/build_umbrella.py cuts the staged pyproject.toml here. Everything below
# configures the local checkout — the uv workspace, the dev install, the shared
# tool settings — and none of it belongs in a metadata-only wheel. `uv build`
# would in fact fail on it, because the staged copy has no packages/ directory
# for [tool.uv.workspace] to point at.
#
# Anything the published distribution needs MUST go above this line.

# Installed automatically by `uv sync` (see default-groups) so a fresh clone can
# run src/agent_team and src/infra_server.py straight away. pip ignores dependency
# groups entirely, so the published metadata stays lean. Referencing the extra
# rather than restating it means this cannot drift from all-extras.
[dependency-groups]
demo = ["akgentic-framework[all-extras]"]
# Lint and type-check the release scripts. Named explicitly in default-groups
# below because setting that key replaces uv's implicit ["dev"] rather than
# adding to it — omit it and a fresh checkout cannot run ruff or mypy.
dev = [
    "mypy>=1.8.0",
    "ruff>=0.1.0",
]

[tool.uv]
default-groups = ["demo", "dev"]

[tool.uv.sources]
akgentic-core = { workspace = true }
akgentic-llm = { workspace = true }
akgentic-agent = { workspace = true }
akgentic-tool = { workspace = true }
akgentic-catalog = { workspace = true }
akgentic-team = { workspace = true }
akgentic-infra = { workspace = true }

[tool.uv.workspace]
members = [
    "packages/akgentic-core",
    "packages/akgentic-llm",
    "packages/akgentic-agent",
    "packages/akgentic-tool",
    "packages/akgentic-catalog",
    "packages/akgentic-team",
    "packages/akgentic-infra",
]

# Python version requirement is set per-package in individual pyproject.toml files

# Shared pytest configuration for all workspace packages
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages/*/tests"]
python_files = ["test_*.py"]
addopts = "-v"
markers = [
    "integration: tests requiring external services (LLM API keys)",
]

# Shared coverage configuration
[tool.coverage.run]
source = ["packages/*/src"]
branch = true
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true

# Shared mypy configuration
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true

# akgentic-tool: pre-existing type errors — exempted to keep CI green.
# New files in these modules must pass strict mypy before the override is removed.
[[tool.mypy.overrides]]
module = [
    "akgentic.tool.core",
    "akgentic.tool.event",
    "akgentic.tool.team.team",
    "akgentic.tool.planning.planning",
    "akgentic.tool.planning.planning_actor",
    "akgentic.tool.knowledge_graph.kg_tool",
    "akgentic.tool.search.search",
    "akgentic.tool.mcp.mcp",
    "akgentic.tool.sandbox.actor",
    "akgentic.tool.workspace.readers",
]
ignore_errors = true

# Shared ruff configuration
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "ANN", "ASYNC", "C901", "PLR0912", "PLR0915"]
ignore = ["ANN401", "N802"]  # Allow Any in serialization, allow Pykka patterns

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-branches = 12
max-statements = 50
