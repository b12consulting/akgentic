# nginx config for the Angular web UI.
#
# Owned by THIS repo on purpose. The default FRONTEND_SOURCE=release path
# fetches a prebuilt bundle from the akgentic-frontend GitHub release, which
# contains the web root only — no nginx.conf — so the stack must supply its
# own or it would need the submodule checked out just for this file, defeating
# the point of the release path.
#
# Kept behaviourally identical to packages/akgentic-frontend/nginx.conf; if
# that file gains a rule the app depends on, mirror it here.

server {
    listen 4200;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing: deep links are served index.html and resolved client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # config.json is written at container start and repoints the bundle at the
    # API. It MUST NOT be cached, or a changed API_URL would be ignored by any
    # browser holding an old copy. Declared before the static-asset rule below,
    # which would otherwise not match it anyway — this is belt and braces.
    location = /config.json {
        add_header Cache-Control "no-store";
    }

    # Hashed bundle filenames make these safe to cache indefinitely.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
