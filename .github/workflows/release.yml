name: Release

# Manual release: reads version from pyproject.toml on the dispatched ref, tags
# that ref's HEAD, builds the wheel, and creates a GitHub Release with the wheel
# attached.
#
#   gh workflow run release.yml -R b12consulting/akgentic-team --ref <branch>
#
# The branch is the dispatch ref, not a workflow input — workflow_dispatch
# already loads this file from the ref it runs on, so the tree released always
# matches the workflow that released it. Do NOT reintroduce a hardcoded `ref:`
# on the checkout below: it releases that branch whatever you dispatched on,
# silently, which is how a maintenance branch gets tagged with mainline code.
#
# Version bumps are a separate PR against the release branch; this workflow
# never pushes commits — branch protection blocks that.

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout dispatched ref
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Read version from pyproject.toml
        id: version
        run: |
          VERSION=$(grep -E '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          echo "Releasing version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify tag does not already exist
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag v$VERSION already exists. Bump the version in pyproject.toml first."
            exit 1
          fi

      - name: Tag dispatched ref HEAD
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "v$VERSION"
          git push origin "v$VERSION"

      - name: Build wheel
        run: uv build --wheel --out-dir dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.version.outputs.version }}"
          name: "v${{ steps.version.outputs.version }}"
          files: dist/*.whl
          generate_release_notes: true
