name: Release

# Manual release: reads version from pyproject.toml on the dispatched branch,
# tags that branch's HEAD, builds the wheel, and creates a GitHub Release with
# the wheel attached. The branch is whatever was selected in the "Run workflow"
# dropdown on the Actions tab (e.g. master, version-2.x).
#
# Bumping the version is a separate maintainer action via a normal PR. This
# workflow does NOT push commits — branch protection blocks that. The release
# flow is therefore two-step:
#   1. Open a "chore: bump version to X.Y.Z" PR; merge it.
#   2. Trigger this workflow from the Actions tab against the desired branch.

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout dispatched branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          # Needed by verify_submodules.py and sync_versions.py --check, which
          # read the pinned sources. The build itself does not use them.
          submodules: true

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Read version from pyproject.toml
        id: version
        run: |
          VERSION=$(grep -E '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          echo "Releasing version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify tag does not already exist
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag v$VERSION already exists. Bump the version in pyproject.toml first."
            exit 1
          fi

      - name: Tag branch HEAD
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "v$VERSION"
          git push origin "v$VERSION"

      # Only the umbrella. Subpackage wheels are built and released by their own
      # repositories; the bundle tarball that used to carry them here existed for
      # a `--find-links` install story that PyPI has superseded.
      - name: Verify every pinned version is published
        run: uv run python scripts/verify_pins.py

      - name: Verify the pins match the submodules
        run: |
          uv run python scripts/verify_submodules.py
          uv run python scripts/sync_versions.py --check

      - name: Build the umbrella
        run: uv run python scripts/build_umbrella.py dist/

      - name: Collect the commits in this release
        id: commits
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # generate_release_notes below builds "What's Changed" from PULL
          # REQUESTS only, so a release whose range is direct pushes renders an
          # empty section -- akgentic-core v1.5.3 shipped an init_llm_context
          # signature change that way, with notes showing only a compare link.
          #
          # Ask GitHub what it WOULD generate before creating the release. If it
          # can list PRs, leave the body empty so the notes stay exactly as they
          # are today. Only when it cannot do we supply the commit list, which
          # the API pre-pends to the generated compare link.
          NOTES=$(gh api --method POST \
            "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="v$VERSION" --jq .body 2>/dev/null || true)
          if printf '%s' "$NOTES" | grep -q "What's Changed"; then
            echo "PR-based notes available -- leaving the release body empty."
            exit 0
          fi
          echo "No PRs in range -- falling back to a commit list."
          PREV=$(git describe --tags --abbrev=0 "v$VERSION^" 2>/dev/null || true)
          if [ -n "$PREV" ]; then
            RANGE="$PREV..v$VERSION"
            HEADING="### Commits since $PREV"
          else
            RANGE="v$VERSION"
            HEADING="### Commits"
          fi
          {
            echo "body<<RELEASE_BODY_EOF"
            echo "$HEADING"
            echo
            git log --no-merges --reverse --pretty=format:'- %s (`%h`)' "$RANGE"
            echo
            echo "RELEASE_BODY_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.version.outputs.version }}"
          name: "v${{ steps.version.outputs.version }}"
          files: |
            dist/akgentic_framework-${{ steps.version.outputs.version }}-py3-none-any.whl
            dist/akgentic_framework-${{ steps.version.outputs.version }}.tar.gz
          body: ${{ steps.commits.outputs.body }}
          generate_release_notes: true
